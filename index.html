<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartivon</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.png">
<script>
(function(){
  try {
    var t = localStorage.getItem('cartivon_theme') || 'auto';
    if(t === 'auto'){
      var d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
    } else {
      document.documentElement.dataset.theme = t;
    }
  } catch(e){}
})();
</script>
<style>
:root{--bg:#f8fafc;--card:#ffffff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pr:#4f46e5;--pr2:#eef2ff;--gr:linear-gradient(135deg,#6366f1,#4f46e5);--sh:0 1px 3px rgba(0,0,0,.04),0 10px 25px -5px rgba(15,23,42,.06);--r:16px}
[data-theme=dark]{--bg:#0b0f19;--card:#111827;--tx:#f1f5f9;--mu:#94a3b8;--bd:#1f2937;--pr:#6366f1;--pr2:#1e1b4b;--sh:0 10px 30px -10px rgba(0,0,0,.5)}
*{box-sizing:border-box}html,body{height:100%;margin:0;scroll-behavior:smooth}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(140,150,180,0.3);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:rgba(140,150,180,0.55)}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:none;height:100vh;max-height:100vh;overflow:hidden}
aside{width:250px;height:100vh;max-height:100vh;background:linear-gradient(180deg,#0f172a,#1e293b);color:#cbd5e1;border-right:1px solid rgba(255,255,255,0.06);padding:16px 12px 12px;display:flex;flex-direction:column;flex-shrink:0;box-sizing:border-box}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 12px;color:#fff;flex-shrink:0}.brand b{font-size:18px;letter-spacing:-.3px;display:block;line-height:1.1}.brand small{color:#8f98d6;font-size:11px}
#store_box{flex-shrink:0}
#nav{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:3px;min-height:0;padding-right:2px;margin:4px 0}
#nav::-webkit-scrollbar{width:4px}
#nav::-webkit-scrollbar-track{background:transparent}
#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);border-radius:4px}
#nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.35)}
.nv{all:unset;cursor:pointer;display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:11px;font-weight:500;transition:all .18s ease;font-size:13px;flex-shrink:0}
.nv:hover{background:rgba(255,255,255,.07);color:#fff}.nv.on{background:var(--gr);color:#fff;box-shadow:0 8px 20px -8px #6366f1}
.nv:active{transform:scale(0.98)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.me{margin-top:auto;flex-shrink:0;background:rgba(255,255,255,.07);border-radius:13px;padding:10px 12px;display:flex;gap:10px;align-items:center;border:1px solid rgba(255,255,255,0.08)}
.av{width:36px;height:36px;border-radius:50%;background:var(--gr);display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0}
.me b{color:#fff;display:block;line-height:1.2;font-size:13px}.me small{color:#8f98d6;font-size:11px}.me button{all:unset;cursor:pointer;margin-left:auto;color:#8f98d6;font-size:12px;padding:4px 8px;border-radius:6px;transition:.15s}.me button:hover{color:#fff;background:rgba(255,255,255,.12)}
main{flex:1;height:100vh;overflow-y:auto;overflow-x:hidden;padding:24px 28px 48px;min-width:0;position:relative;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:23px;letter-spacing:-.5px;margin:0}.sub{color:var(--mu);margin-top:2px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:box-shadow .2s ease,border-color .2s ease}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpi{display:flex;gap:14px;align-items:center}.kpi .ch{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.kpi small{color:var(--mu);font-size:12px}.kpi div div{font-size:21px;font-weight:700;letter-spacing:-.4px}
.b,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:8px 12px;transition:all .15s ease}
input:focus,select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
.b{cursor:pointer;font-weight:600;user-select:none}.b:hover{border-color:var(--pr);color:var(--pr)}.b:active{transform:scale(0.96)}
.p{background:var(--gr);color:#fff!important;border:0;box-shadow:0 8px 18px -8px #6366f1}.p:hover{filter:brightness(1.08)}.d{color:#e11d48}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;background:var(--bg);border:1px solid var(--bd);cursor:pointer;transition:all .15s ease;user-select:none}
.chip:hover{border-color:var(--pr);color:var(--pr)}.chip:active{transform:scale(0.95)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}th,td{padding:11px 10px;border-bottom:1px solid var(--bd)}tr:last-child td{border:0}.tw{overflow-x:auto}
.tag{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}.ok{background:#d1fae5;color:#047857}.wa{background:#fef3c7;color:#b45309}.er{background:#ffe4e6;color:#be123c}.in{background:#e0e7ff;color:#3730a3}.pu{background:#f3e8ff;color:#6b21a8}
.pos{display:flex;flex-direction:column;gap:8px;width:100%;min-width:0}
.pos-left-wrap{width:100%;min-width:0;display:flex;flex-direction:column;gap:8px}
.pos-cart-panel{width:100%;min-width:0;box-sizing:border-box;display:flex;flex-direction:column}
.pos-checkout-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
@media(max-width: 860px){.pos-checkout-grid{grid-template-columns:1fr!important;gap:10px!important}}

/* Full-Screen Locked POS Terminal Layout on Desktop / Laptop */
@media(min-width: 861px){
  body.pos-active main,
  main:has(.pos){
    height:100vh!important;
    max-height:100vh!important;
    overflow:hidden!important;
    padding:10px 18px 0!important;
    display:flex!important;
    flex-direction:column!important;
    box-sizing:border-box!important;
  }
  body.pos-active main .top,
  main:has(.pos) .top{
    margin-bottom:6px!important;
    flex-shrink:0!important;
  }
  body.pos-active .pos,
  main:has(.pos) .pos{
    flex:1!important;
    min-height:0!important;
    display:flex!important;
    flex-direction:column!important;
    gap:6px!important;
  }
  body.pos-active .pos-left-wrap,
  main:has(.pos) .pos-left-wrap{
    flex:1!important;
    min-height:0!important;
    display:flex!important;
    flex-direction:column!important;
    gap:6px!important;
  }
  body.pos-active .pos-cart-panel,
  main:has(.pos) .pos-cart-panel{
    flex:1!important;
    min-height:0!important;
    display:flex!important;
    flex-direction:column!important;
    overflow:hidden!important;
    padding:8px 14px 0!important;
  }
  body.pos-active .pos-cart-items-wrap,
  main:has(.pos) .pos-cart-items-wrap{
    flex:1!important;
    min-height:80px!important;
    max-height:none!important;
    overflow-y:auto!important;
    overflow-x:hidden!important;
    padding-right:6px!important;
    margin-bottom:0!important;
  }
  body.pos-active .pos-bottom-fixed-bar,
  main:has(.pos) .pos-bottom-fixed-bar{
    flex-shrink:0!important;
    margin-top:auto!important;
    padding-top:6px!important;
    padding-bottom:4px!important;
    border-top:1.5px solid var(--bd)!important;
    background:var(--card)!important;
    z-index:20!important;
  }
}

/* POS Fixed Bottom Subtotal & Payment Bar */
.pos-bottom-fixed-bar{position:sticky;bottom:0;background:var(--card);padding-top:8px;padding-bottom:4px;margin-top:auto;border-top:1.5px solid var(--bd);z-index:20;box-shadow:0 -6px 20px rgba(0,0,0,0.06)}
@media(max-width: 860px){
  body.pos-active main,
  main:has(.pos){height:auto!important;min-height:100vh!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;padding:12px 10px 140px!important}
  .pos-bottom-fixed-bar{position:static!important;box-shadow:none!important;border-top:1px dashed var(--bd)!important;margin-top:10px!important}
  .pos-cart-items-wrap{max-height:260px!important;overflow-y:auto!important}
}

/* POS Phone / MFS Provider Buttons */
.pos-mfs-btn{all:unset;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 4px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--card);border:1.5px solid var(--bd);color:var(--tx);transition:all .15s ease;user-select:none;box-sizing:border-box}
.pos-mfs-btn:hover{border-color:var(--pr)}
.pos-mfs-btn.active-bkash{background:rgba(226,19,110,0.08);border-color:#e2136e;color:#be123c;box-shadow:0 2px 6px rgba(226,19,110,0.18)}
.pos-mfs-btn.active-nagad{background:rgba(247,148,29,0.08);border-color:#f7941d;color:#c2410c;box-shadow:0 2px 6px rgba(247,148,29,0.18)}
.pos-mfs-btn.active-rocket{background:rgba(140,52,148,0.08);border-color:#8c3494;color:#7e22ce;box-shadow:0 2px 6px rgba(140,52,148,0.18)}
.pos-mfs-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

/* POS Cart Items Scrollable List */
.pos-cart-items-wrap{min-height:100px;overflow-y:auto;overflow-x:hidden;padding-right:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;margin-bottom:8px}
.pos-cart-items-wrap::-webkit-scrollbar{width:6px}
.pos-cart-items-wrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.pos-cart-items-wrap::-webkit-scrollbar-thumb:hover{background:var(--pr)}

/* POS Cart Line Items */
.pos-cart-line{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.pos-cart-info{flex:1;min-width:0}
.pos-cart-name{font-size:13.5px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-cart-sub{font-size:11.5px;color:var(--mu);margin-top:2px;display:flex;align-items:center;gap:6px}
.pos-cart-ctrls{display:flex;align-items:center;gap:12px;flex-shrink:0}

/* POS Offcanvas Right-Side Catalog Drawer */
#pos_catalog_backdrop{position:fixed;inset:0;background:rgba(15,23,42,0.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:1040;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}
#pos_catalog_backdrop.open{opacity:1;visibility:visible}
#pos_catalog_drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:94vw;background:var(--card);border-left:1px solid var(--bd);box-shadow:-8px 0 32px rgba(0,0,0,0.28);z-index:1050;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(0.16,1,0.3,1);box-sizing:border-box}
#pos_catalog_drawer.open{transform:translateX(0)}
.pos-drawer-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);background:var(--card);gap:10px}
.pos-drawer-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.pos-drawer-footer{padding:12px 14px;border-top:1px solid var(--bd);background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px}
.pos-pay-tab{all:unset;flex:1;text-align:center;padding:6px 6px;border-radius:6px;font-size:11.5px;font-weight:700;color:var(--mu);cursor:pointer;transition:all .15s ease;user-select:none}
.pos-pay-tab:hover{color:var(--tx)}
.pos-pay-tab.on{background:var(--pr);color:#fff;box-shadow:0 2px 6px rgba(79,70,229,.3)}
.cat-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chip{white-space:nowrap;padding:4px 10px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--mu);transition:all .15s ease;flex-shrink:0;user-select:none}
.cat-chip:hover{color:var(--tx);border-color:var(--pr)}.cat-chip:active{transform:scale(0.95)}
.cat-chip.on{background:var(--gr);color:#fff;border-color:transparent;box-shadow:0 2px 8px -2px rgba(99,102,241,0.5)}
.pg{display:grid;grid-template-columns:repeat(3, 1fr);gap:6px;margin-top:6px;overflow-y:auto;max-height:calc(100vh - 210px);padding-right:2px}
.pi{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--sh);transition:all .15s ease;user-select:none;box-sizing:border-box}
.pi:hover:not(.x){transform:translateY(-1px);border-color:var(--pr);box-shadow:0 4px 10px -2px rgba(99,102,241,0.2)}
.pi:active:not(.x){transform:translateY(0);scale:0.98}
.pi.x{opacity:.45;cursor:not-allowed;transform:none}
.pi b{font-size:11.5px;line-height:1.25;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:28px}
.pi .pr{font-weight:800;color:var(--pr);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.line{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin-bottom:7px;transition:border-color .15s ease}
.line:hover{border-color:rgba(99,102,241,0.35)}
.qty-btn{width:28px;height:28px;border-radius:6px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--bd);cursor:pointer;user-select:none;transition:all .12s}
.qty-btn:active{transform:scale(0.92);background:var(--pr2);border-color:var(--pr)}
.tot div{display:flex;justify-content:space-between;padding:2.5px 0;font-size:13px}
.tot .gt{font-size:20px;font-weight:900;border:1.5px solid var(--pr);border-radius:8px;background:linear-gradient(135deg,rgba(99,102,241,0.1),rgba(79,70,229,0.04));padding:9px 12px;margin-top:8px;color:var(--pr);display:flex;justify-content:space-between;align-items:center;letter-spacing:-.3px}
.empty{text-align:center;color:var(--mu);padding:24px 8px}
#modal{position:fixed;inset:0;background:rgba(5,8,24,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
#mbox{max-width:540px;width:100%;max-height:92vh;overflow:auto}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:12px;font-weight:600}.f .w{grid-column:1/-1}.f input,.f select,.f textarea{width:100%}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:all .25s cubic-bezier(0.16, 1, 0.3, 1);background:#0f172a;color:#fff;padding:11px 22px;border-radius:30px;display:none;align-items:center;gap:8px;z-index:100;box-shadow:0 12px 32px rgba(0,0,0,0.35);font-weight:600;font-size:13px;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bar{display:flex;align-items:end;gap:8px;height:180px;margin-top:16px;padding:0 6px}.bar>div{flex:1;display:flex;flex-direction:column;justify-content:end;height:100%;font-size:11px;color:var(--mu);text-align:center;cursor:pointer}.bar i{display:block;background:var(--gr);border-radius:8px 8px 3px 3px;min-height:4px;transition:.2s}.bar>div:hover i{filter:brightness(1.2);box-shadow:0 0 10px rgba(99,102,241,.6)}
.meter{background:var(--pr2);border-radius:8px;height:9px;margin-top:5px}.meter div{height:9px;border-radius:8px;background:var(--gr)}
#login{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(800px 500px at 50% 20%,rgba(99,102,241,0.18) 0,transparent 70%),var(--bg);padding:16px;z-index:90;overflow-y:auto}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:26px 24px;box-shadow:var(--sh);animation:fadeIn .25s ease}
#receipt{font:12px/1.5 ui-monospace,Menlo,monospace}#receipt hr{border:0;border-top:1px dashed var(--mu)}#receipt .r{display:flex;justify-content:space-between}
.kb-bar{display:flex;gap:12px;font-size:11px;color:var(--mu);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;margin-top:14px;flex-wrap:wrap}
.kb-bar kbd{background:var(--bg);border:1px solid var(--bd);padding:2px 6px;border-radius:5px;font-family:inherit;font-weight:700;color:var(--tx)}
#mob_header{
  display:none;
  height:52px;
  background:linear-gradient(180deg,#0f172a,#1e293b);
  color:#fff;
  padding:0 12px;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:80;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.mob-icon-btn{
  all:unset;
  cursor:pointer;
  width:36px;
  height:36px;
  border-radius:10px;
  display:grid;
  place-items:center;
  color:#c7cdf0;
  transition:.15s;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.mob-icon-btn:active{background:rgba(255,255,255,0.1);transform:scale(0.94)}
.mob-close-btn{
  all:unset;
  cursor:pointer;
  margin-left:auto;
  width:30px;
  height:30px;
  border-radius:8px;
  display:none;
  place-items:center;
  font-size:15px;
  font-weight:700;
  color:#8f98d6;
  background:rgba(255,255,255,0.08);
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.mob-close-btn:active{background:rgba(255,255,255,0.18)}
#mob_bottom_nav{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:58px;
  background:var(--card);
  border-top:1px solid var(--bd);
  padding:0 4px env(safe-area-inset-bottom,0px);
  z-index:85;
  box-shadow:0 -4px 18px rgba(0,0,0,0.08);
  justify-content:space-around;
  align-items:center;
}
.mb-btn{
  all:unset;
  cursor:pointer;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:6px 0;
  color:var(--mu);
  font-size:10px;
  font-weight:600;
  transition:all .15s ease;
  border-radius:10px;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.mb-btn svg{width:20px;height:20px}
.mb-btn.on{color:var(--pr);font-weight:800}
.mb-btn:active{transform:scale(0.92)}
#mob_cart_strip{
  position:fixed;
  bottom:66px;
  left:10px;
  right:10px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;
  padding:10px 14px;
  border-radius:16px;
  box-shadow:0 10px 25px -4px rgba(79,70,229,0.5);
  z-index:84;
  display:none;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  animation:fadeIn .25s ease;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#mob_cart_strip:active{transform:scale(0.98)}
#mob_overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(5,8,24,0.65);
  backdrop-filter:blur(4px);
  z-index:999;
}
#mob_overlay.open{display:block}

/* Responsive Media Queries for Tablets & Phones */
@media(max-width: 980px){
  body{overflow-y:auto!important}
  #app{flex-direction:column!important;height:auto!important;max-height:none!important;overflow:visible!important}
  #mob_header{display:flex!important}
  #mob_bottom_nav{display:flex!important}
  aside{
    position:fixed!important;
    top:0!important;
    left:0!important;
    bottom:0!important;
    width:290px!important;

/* Bulletproof 80mm Single-Page Thermal Receipt & Report Print Stylesheet */
@media print {
  @page {
    size: 80mm auto;
    margin: 0;
  }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: #fff !important;
    color: #000 !important;
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    overflow: visible !important;
    width: 80mm !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  /* Suppress all main app chrome to eliminate extra blank pages */
  #app,
  #login,
  #sidebar,
  #mob_bottom_nav,
  #mob_cart_strip,
  #toast,
  .kb-bar,
  .no-print,
  button,
  .b,
  #receipt + .row {
    display: none !important;
  }

  /* Modal container transformed into static paper docket flow */
  #modal {
    display: block !important;
    position: static !important;
    inset: auto !important;
    background: transparent !important;
    padding: 0 !important;
    margin: 0 auto !important;
    width: 80mm !important;
    max-width: 80mm !important;
    height: auto !important;
    min-height: 0 !important;
    box-shadow: none !important;
    overflow: visible !important;
  }

  #mbox {
    display: block !important;
    position: static !important;
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
    padding: 2mm 3mm !important;
    margin: 0 auto !important;
    width: 80mm !important;
    max-width: 80mm !important;
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    overflow: visible !important;
    border-radius: 0 !important;
  }

  #receipt {
    display: block !important;
    position: static !important;
    width: 100% !important;
    max-width: 74mm !important;
    margin: 0 auto !important;
    padding: 0 !important;
    color: #000 !important;
    background: transparent !important;
    font-family: ui-monospace, Menlo, Consolas, 'Courier New', monospace !important;
    font-size: 11px !important;
    line-height: 1.34 !important;
    page-break-after: avoid !important;
    page-break-before: avoid !important;
    page-break-inside: avoid !important;
    break-after: avoid !important;
    break-before: avoid !important;
    break-inside: avoid !important;
  }

  #receipt * {
    visibility: visible !important;
    color: #000 !important;
  }

  #receipt .r {
    display: flex !important;
    justify-content: space-between !important;
    font-size: 11px !important;
  }

  #receipt hr {
    border: none !important;
    border-top: 1px dashed #000 !important;
    margin: 4px 0 !important;
  }

  /* Support printing standard A4/Letter business reports when requested */
  body.printing-report @page {
    size: auto;
    margin: 8mm;
  }
  body.printing-report {
    width: 100% !important;
  }
  body.printing-report #app {
    display: block !important;
  }
  body.printing-report #modal {
    display: none !important;
  }
  body.printing-report #main {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
  }
  body.printing-report .top .row,
  body.printing-report .tab-bar {
    display: none !important;
  }
}

// Web Audio API Sound Engine (100% offline retail sound effects)
let soundEnabled=true;
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)audioCtx=new AC();
  }
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}

// 1. Supermarket Barcode Scanner "Pip!" Beep
function soundScan(){
  if(!soundEnabled)return;
  try{
    const ctx=getAudioCtx();if(!ctx)return;
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(1950,ctx.currentTime);
    gain.gain.setValueAtTime(0.18,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.07);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+0.07);
  }catch(e){}
}

// 2. Cash Register Drawer Opening / Sale Success "Cha-Ching!" Chime
function soundCash(){
  if(!soundEnabled)return;
  try{
    const ctx=getAudioCtx();if(!ctx)return;
    const now=ctx.currentTime;
    const osc1=ctx.createOscillator(),g1=ctx.createGain();
    osc1.type='triangle';
    osc1.frequency.setValueAtTime(987.77,now);
    osc1.frequency.exponentialRampToValueAtTime(1318.51,now+0.12);
    g1.gain.setValueAtTime(0.2,now);
    g1.gain.exponentialRampToValueAtTime(0.001,now+0.35);
    osc1.connect(g1);g1.connect(ctx.destination);
    osc1.start(now);osc1.stop(now+0.35);

    const osc2=ctx.createOscillator(),g2=ctx.createGain();
    osc2.type='sine';
    osc2.frequency.setValueAtTime(1567.98,now+0.08);
    g2.gain.setValueAtTime(0.15,now+0.08);
    g2.gain.exponentialRampToValueAtTime(0.001,now+0.45);
    osc2.connect(g2);g2.connect(ctx.destination);
    osc2.start(now+0.08);osc2.stop(now+0.45);
  }catch(e){}
}

// 3. Crisp button tap
function soundClick(){
  if(!soundEnabled)return;
  try{
    const ctx=getAudioCtx();if(!ctx)return;
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(750,ctx.currentTime);
    gain.gain.setValueAtTime(0.06,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.03);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+0.03);
  }catch(e){}
}

// 4. Alert / warning buzz
function soundWarn(){
  if(!soundEnabled)return;
  try{
    const ctx=getAudioCtx();if(!ctx)return;
    const now=ctx.currentTime;
    [0,0.11].forEach(offset=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type='sawtooth';osc.frequency.setValueAtTime(260,now+offset);
      gain.gain.setValueAtTime(0.12,now+offset);
      gain.gain.exponentialRampToValueAtTime(0.001,now+offset+0.09);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(now+offset);osc.stop(now+offset+0.09);
    });
  }catch(e){}
}

async function api(a,body,qs=''){
  const r=await fetch('api.php?a='+a+qs,{method:body?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF':csrf},body:body?JSON.stringify(body):undefined});

function toast(m){
  const t=$('#toast');
  t.innerHTML=m;

function onDashCustomDateChange(){
  const fromEl=$('#dash_from_input');
  const toEl=$('#dash_to_input');
  if(!fromEl||!toEl)return;
  let fromVal=fromEl.value;
  let toVal=toEl.value;
  if(fromVal&&toVal){
    const dFrom=new Date(fromVal);
    const dTo=new Date(toVal);
    const diffDays=(dTo-dFrom)/(86400000);
    if(diffDays>730){
      toast(currentLang==='bn'?'কাস্টম সময়সীমা সর্বোচ্চ ২ বছর হতে পারে।':'Custom date range cannot exceed 2 years. Adjusted to 2 years.');
      const adjustedFrom=new Date(dTo.getTime()-730*86400000);
      fromEl.value=adjustedFrom.toISOString().slice(0,10);
    }
  }
}

function applyDashCustomDates(){
  const fromEl=$('#dash_from_input');
  const toEl=$('#dash_to_input');
  if(!fromEl||!toEl)return;
  onDashCustomDateChange();
  dashCustomFrom=fromEl.value;
  dashCustomTo=toEl.value;
  dashPeriod='custom';
  rDash();
}

/* ==========================================================================
   2. CASHIER & POINT OF SALE (POS) WITH REGISTER SHIFTS & LOYALTY
   ========================================================================== */
function calc(){
  const L=cart.map(i=>{
    const g=i.qty*i.price;
    let d=i.dt==='percent'?g*Math.min(i.dv,100)/100:+i.dv;
    d=Math.max(0,Math.min(g,d||0));
    return {...i,net:g-d};
  });
  const sub=L.reduce((a,l)=>a+l.net,0);
  let c=cd.type==='percent'?sub*Math.min(cd.val,100)/100:+cd.val;
  c=Math.max(0,Math.min(sub,c||0));

  let coupDisc=0;
  if(activeCoupon){
    if(sub>=(activeCoupon.min_order||0)){
      coupDisc=activeCoupon.type==='percent'?sub*Math.min(activeCoupon.val,100)/100:activeCoupon.val;
      coupDisc=Math.max(0,Math.min(sub-c,coupDisc));
    }
  }

  const maxPts=parseInt(selectedCustomer?.loyalty_points)||0;
  const valPerPt=parseFloat(storeSettings.loyalty_value)||1;
  const ptsToUse=Math.max(0, Math.min(redeemedPoints, maxPts));
  const rawLoyaltyDisc=r2(ptsToUse * valPerPt);
  const maxAllowedDisc=Math.max(0, sub - c - coupDisc);
  const loyaltyDisc=Math.min(rawLoyaltyDisc, maxAllowedDisc);
  const totalDisc=c+coupDisc+loyaltyDisc;

  let vat=0;
  L.forEach(l=>{l.tot=l.net-(sub?totalDisc*l.net/sub:0);vat+=l.tot*l.vr/(100+l.vr)});
  return {L,sub:r2(sub),c:r2(c),coupDisc:r2(coupDisc),loyaltyDisc:r2(loyaltyDisc),totalDisc:r2(totalDisc),grand:r2(Math.max(0, sub-totalDisc)),vat:r2(vat)};
}

function onPOSSearchInput(val){
  q = val;
  drawGrid();
  const s = (val || '').trim();
  if(s.length >= 3){
    const exact = P.find(x => String(x.barcode||'').toLowerCase() === s.toLowerCase() || x.sku.toLowerCase() === s.toLowerCase());
    if(exact){
      addCart(exact.id);
      q = '';
      if($('#qs')) $('#qs').value = '';
    if($('#pos_cat_search')) $('#pos_cat_search').value = '';
      if($('#pos_cat_search')) $('#pos_cat_search').value = '';
      drawGrid();
      toast(t('pos_auto_added') + exact.name);
    }
  }
}

function scan(){
  const s = q.trim().toLowerCase();
  if(!s){
    if(cart.length > 0){
      checkout();
    }
    return;
  }
  let p = P.find(x => String(x.barcode||'').toLowerCase() === s || x.sku.toLowerCase() === s);
  if(!p){
    // If not exact barcode, check if query matches exactly 1 product
    const matches = P.filter(x => [x.name, x.sku, x.barcode].some(v => String(v||'').toLowerCase().includes(s)));
    if(matches.length === 1) p = matches[0];
  }
  if(p){
    addCart(p.id);
    q = '';
    if($('#qs')) $('#qs').value = '';
    if($('#pos_cat_search')) $('#pos_cat_search').value = '';
    drawGrid();
    toast(t('pos_auto_added') + p.name);
  } else {
    soundWarn();
    toast((currentLang==='bn'?'কোনো পণ্য পাওয়া যায়নি: ':'Product not found: ') + s);
  }
}

  }
  soundScan();

  const it=cart[i],p=P.find(x=>x.id===it.id);

function onLoyaltyPhoneInput(val){
  custPhoneQuery = val;
  const qLower = (val || '').trim().toLowerCase();
  const cleanDigits = (val || '').replace(/\D/g, '');

  if(!qLower){
    selectedCustomer = null;
    redeemedPoints = 0;
    hideCustomerSuggestions();
    return;
  }

  // Live filter in local customersList by phone OR name
  const matches = customersList.filter(c => {
    const ph = (c.phone || '').replace(/\D/g, '');
    const nm = (c.name || '').toLowerCase();
    return (cleanDigits.length >= 2 && ph.includes(cleanDigits)) || nm.includes(qLower);
  });

  // If exact phone match (10 or 11 digits)
  if(cleanDigits.length >= 10){
    const exact = customersList.find(c => c.phone.replace(/\D/g, '') === cleanDigits);
    if(exact){
      selectCustomer(exact);
      return;
    }
  }

  renderCustomerSuggestions(matches, val);

  // If not found locally and 3+ digits, search backend
  if(matches.length === 0 && cleanDigits.length >= 3){
    clearTimeout(loyaltySearchTimer);
    loyaltySearchTimer = setTimeout(async () => {
      try {
        const res = await api('customer_by_phone', null, '&phone=' + encodeURIComponent(cleanDigits));
        if(res && res.id && custPhoneQuery.replace(/\D/g, '') === cleanDigits){
          const idx = customersList.findIndex(x => x.id === res.id);
          if(idx >= 0) customersList[idx] = res; else customersList.push(res);
          renderCustomerSuggestions([res], val);
        }
      } catch(e){}
    }, 250);
  }
}

function updatePaymentChange(){
  const c=calc();
  const totalPaid=(pay.cash||0)+(pay.card||0)+(pay.bkash||0)+(pay.nagad||0)+(pay.rocket||0)+(pay.due||0);
  const ch=totalPaid-c.grand;
  const isOver=ch>=0;

  const box=$('#cart_change_box');
  const label=$('#cart_change_label');
  const val=$('#cart_change_val');

  if(label) label.textContent = isOver ? (currentLang==='bn'?'ফেরত টাকা':'Change to Return') : (currentLang==='bn'?'বকেয়া টাকা':'Remaining Due');

    val.value=money(Math.abs(ch));
    val.style.color=isOver?'#047857':'#be123c';
    val.style.borderColor=isOver?'#10b981':'#ef4444';
    val.style.background=isOver?'rgba(16,185,129,0.05)':'rgba(239,68,68,0.05)';

function fillBalance(method){
  const c=calc();
  const totalPaid=(pay.cash||0)+(pay.card||0)+(pay.bkash||0)+(pay.nagad||0)+(pay.rocket||0)+(pay.due||0);
  const currentThis=pay[method]||0;
  const otherPaid=totalPaid - currentThis;
  const remaining=Math.max(0, r2(c.grand - otherPaid));
  pay[method]=remaining;
  const inputEl=$('#pay_'+method);
  if(inputEl) inputEl.value=remaining>0?remaining:'';
  updatePaymentChange();
  toast('Filled ' + money(remaining) + ' into ' + method.toUpperCase());
}

function applyCoupon(code){run(async()=>{
  const c=(code||'').trim().toUpperCase();
  if(!c)return toast('Please enter a promo coupon code');
  const res=await api('coupon_check',null,'&code='+encodeURIComponent(c));
  const sub=calc().sub;
  if(sub<(res.coupon.min_order||0)){
    throw new Error('Minimum subtotal of '+money(res.coupon.min_order)+' required for coupon '+c);
  }
  activeCoupon={code:c,...res.coupon};
  toast('Coupon '+c+' applied: '+res.coupon.label);
  drawCart();
})}

function removeCoupon(){
  activeCoupon=null;
  toast('Coupon removed');
  drawCart();
}

function calcDenomTotal(){
  const denoms=[1000,500,200,100,50,20,10,5];
  let tot=0;
  for(const d of denoms){
    const cnt=parseInt($('#dn_'+d)?.value)||0;
    tot+=(d*cnt);
  }
  $('#dn_total').textContent=money(tot);
  window._denomTotal=tot;
}

function applyDenominationTotal(){
  pay.cash=window._denomTotal||0;
  closeM();
  if($('#pay_cash')) $('#pay_cash').value=pay.cash;
  updatePaymentChange();
  toast('Cash tendered set to: '+money(pay.cash));
}

  const maxPossible=Math.min(maxPts, maxPtsNeeded);

  modal(`<b>${currentLang==='bn'?'পয়েন্ট রিডিম (তাৎক্ষণিক মূল্যছাড়)':'Redeem Loyalty Points'}</b>

    <label class="w">${currentLang==='bn'?'রিডিম করার পয়েন্ট সংখ্যা:':'Number of Points to Redeem:'}

      ${currentLang==='bn'?'তাৎক্ষণিক ডিসকাউন্ট:':'Instant Discount:'} ${money((redeemedPoints||maxPossible)*valPerPt)}

    <div class="row" style="gap:6px">
      ${maxPts>=10?`<button type="button" class="chip" onclick="$('#pts_redeem').value=Math.min(${maxPossible}, 10);updateRedeemPreview()">10 pts (${money(Math.min(maxPossible, 10)*valPerPt)})</button>`:''}
      ${maxPts>=50?`<button type="button" class="chip" onclick="$('#pts_redeem').value=Math.min(${maxPossible}, 50);updateRedeemPreview()">50 pts (${money(Math.min(maxPossible, 50)*valPerPt)})</button>`:''}
      ${maxPts>=100?`<button type="button" class="chip" onclick="$('#pts_redeem').value=Math.min(${maxPossible}, 100);updateRedeemPreview()">100 pts (${money(Math.min(maxPossible, 100)*valPerPt)})</button>`:''}
      <button type="button" class="chip" onclick="$('#pts_redeem').value=${maxPossible};updateRedeemPreview()">${currentLang==='bn'?'সর্বোচ্চ রিডিম':'Redeem Max'} (${maxPossible} pts)</button>
    </div>
  </div>
  <div class="row" style="margin-top:16px;gap:8px">
    <button class="b p" style="flex:1;height:38px;font-weight:700" onclick="applyRedeemedPoints()">${currentLang==='bn'?'মূল্যছাড় যুক্ত করুন':'Apply Discount'}</button>

function updateRedeemPreview(){

function updateRewardConvertPreview(valPerPt, maxPts){
  const pts = parseInt($('#conv_pts')?.value) || 0;
  const tk = Math.max(0, pts * valPerPt);
  const rem = Math.max(0, maxPts - pts);
  const vEl = $('#conv_preview_val');
  const rEl = $('#conv_preview_rem');
  if(vEl) vEl.textContent = money(tk);
  if(rEl) rEl.textContent = rem + ' pts';
}

async function submitRewardConvert(customerId){
  const pts = parseInt($('#conv_pts')?.value) || 0;
  const expiryDays = parseInt($('#conv_expiry')?.value) || 30;
  const minOrder = parseFloat($('#conv_min_order')?.value) || 0;

  if(pts <= 0) return toast(currentLang==='bn'?'সঠিক point সংখ্যা দিন':'Please enter valid points');

  try {
    const res = await api('reward_points_convert', {
      customer_id: customerId,
      points: pts,
      expiry_days: expiryDays,
      min_order: minOrder
    });

    closeM();
    toast(currentLang==='bn'?'কুপন সফলভাবে তৈরি হয়েছে! কোড: ' + res.coupon_code : 'Coupon created successfully! Code: ' + res.coupon_code);

    // Update customer points in memory
    const cIdx = customersList.findIndex(c => c.id === customerId);
    if(cIdx >= 0) customersList[cIdx].loyalty_points = res.remaining_points;
    if(selectedCustomer && selectedCustomer.id === customerId){
      selectedCustomer.loyalty_points = res.remaining_points;
    }

    if(view === 'pos') drawCart();
    if(view === 'rewards') rRewards();

    showRewardVoucherModal(res);
  } catch(e){
    toast(e.message);
  }
}

function onRewardCustSelect(cid, valPerPt){
  const sel = $('#rw_cust_select');
  const opt = sel?.options[sel.selectedIndex];
  const card = $('#rw_cust_card');
  if(!cid || !opt){
    if(card) card.style.display = 'none';
    return;
  }
  const pts = parseInt(opt.getAttribute('data-pts')) || 0;
  const name = opt.getAttribute('data-name');
  const phone = opt.getAttribute('data-phone');

  $('#rw_c_name').textContent = name;
  $('#rw_c_phone').textContent = phone;
  $('#rw_c_pts').textContent = pts + ' pts';
  $('#rw_c_val').textContent = money(pts * valPerPt);
  if(card) card.style.display = 'block';

  $('#rw_pts_input').value = pts;
  $('#rw_pts_input').max = pts;
  updateRwGeneratorPreview(valPerPt);
}

function setRwPts(val, valPerPt){
  const sel = $('#rw_cust_select');
  const opt = sel?.options[sel.selectedIndex];
  if(!opt || !opt.value) return toast(currentLang==='bn'?'প্রথমে কাস্টমার বেছে নিন':'Please select a customer first');
  const maxPts = parseInt(opt.getAttribute('data-pts')) || 0;
  const pts = val === 'all' ? maxPts : Math.min(val, maxPts);
  $('#rw_pts_input').value = pts;
  updateRwGeneratorPreview(valPerPt);
}

function updateRwGeneratorPreview(valPerPt){
  const pts = parseInt($('#rw_pts_input')?.value) || 0;
  const prev = $('#rw_val_preview');
  if(prev) prev.textContent = money(pts * valPerPt);
}

async function submitRwQuickConvert(valPerPt){
  const cid = parseInt($('#rw_cust_select')?.value);
  if(!cid) return toast(currentLang==='bn'?'কাস্টমার নির্বাচন করুন':'Please select a customer');
  const pts = parseInt($('#rw_pts_input')?.value) || 0;
  if(pts <= 0) return toast(currentLang==='bn'?'সঠিক পয়েন্ট সংখ্যা দিন':'Please enter valid points');
  const expiry = parseInt($('#rw_expiry_select')?.value) || 30;

  try {
    const res = await api('reward_points_convert', {
      customer_id: cid,
      points: pts,
      expiry_days: expiry,
      min_order: 0
    });

    toast(currentLang==='bn'?'কুপন সফলভাবে তৈরি হয়েছে! কোড: ' + res.coupon_code : 'Coupon created successfully! Code: ' + res.coupon_code);

    const cIdx = customersList.findIndex(c => c.id === cid);
    if(cIdx >= 0) customersList[cIdx].loyalty_points = res.remaining_points;
    if(selectedCustomer && selectedCustomer.id === cid){
      selectedCustomer.loyalty_points = res.remaining_points;
    }

    rRewards();
    showRewardVoucherModal(res);
  } catch(e) {
    toast(e.message);
  }
}

function clearCart(){
  cart=[];cd={type:'percent',val:0};activeCoupon=null;
  pay={cash:0,card:0,bkash:0,nagad:0,rocket:0,due:0};
  payDetails={card_last4:'',bkash_trx:'',nagad_trx:'',rocket_trx:'',mfs_sender:''};
  orderNote='';uid=nid();activePayMethod='cash';
  selectedCustomer=null;custPhoneQuery='';redeemedPoints=0;
  drawCart();
}

function checkout(){run(async()=>{
  if(!cart.length)throw new Error('Cart is empty');
  const c=calc();
  let totalPaid=pay.cash+pay.card+pay.bkash+pay.nagad+pay.rocket+(pay.due||0);
  if(totalPaid <= 0 && c.grand > 0){
    const meth = ['bkash','nagad','rocket'].includes(activePayMethod) ? (window._activeMfsProvider || 'bkash') : (activePayMethod || 'cash');
    pay[meth] = c.grand;
    totalPaid = c.grand;
  }
  if(totalPaid+0.001<c.grand)throw new Error('Total payment is less than total due');

  const payload={
    uuid:uid,
    items:cart.map(i=>({id:i.id,qty:i.qty,dt:i.dt,dv:i.dv})),
    cd,
    coupon:activeCoupon?activeCoupon.code:null,
    pay,
    pay_details:payDetails,
    customer_id:selectedCustomer?.id||null,
    points_to_deduct:redeemedPoints||0,
    points_redeemed:redeemedPoints||0,
    note:orderNote
  };

  const r=await api('checkout',payload);
  soundCash();
  window._lastReceiptCustomerPhone=selectedCustomer?.phone||'';
  clearCart();
  await loadP();
  await loadCustomers();
  await checkShift();
  drawGrid();
  receipt(r);
})}

const held=()=>{try{return JSON.parse(localStorage.getItem('held')||'[]')}catch(e){return[]}},setHeld=h=>{try{localStorage.setItem('held',JSON.stringify(h))}catch(e){}};
function holdCart(){if(!cart.length)return toast('Nothing to hold');setHeld([...held(),{cart,cd,customer:selectedCustomer,phoneQuery:custPhoneQuery,redeemedPoints,at:Date.now()}]);clearCart();rPOS();toast('Order held successfully')}
function showHeld(){const h=held();modal(`<b>Held Orders</b>${h.length?`<table>${h.map((o,i)=>`<tr><td>${new Date(o.at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</td><td>${o.cart.length} items</td><td style="text-align:right"><button class="b" onclick="resume(${i})">Resume</button> <button class="b d" onclick="setHeld(held().filter((_,j)=>j!==${i}));showHeld();rPOS()">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No held orders.</div>'}<div class="row" style="margin-top:12px"><button class="b" onclick="closeM()">Close</button></div>`)}
function resume(i){const h=held(),o=h.splice(i,1)[0];setHeld(h);cart=o.cart.filter(c=>P.find(p=>p.id===c.id));cd=o.cd;selectedCustomer=o.customer||null;custPhoneQuery=o.phoneQuery||(selectedCustomer?selectedCustomer.phone:'');redeemedPoints=o.redeemedPoints||0;closeM();rPOS()}

        <div>
          <b style="font-size:17px">Price Checker & Stock Lookup</b>
          <div class="mu" style="font-size:12px">Instant barcode or SKU scan / price inquiry kiosk</div>
        </div>
      </div>
      <button class="b" onclick="closeM()" style="padding:4px 9px" title="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

      <div class="search-box" style="flex:1">
        <input id="pc_query" placeholder="Scan barcode with scanner gun or type product name/SKU..." value="${esc(initQuery)}" autofocus
          oninput="doPriceCheckLookup(this.value)"
          onkeydown="if(event.key==='Enter')doPriceCheckLookup(this.value,true)">
      </div>
    </div>

    <div id="pc_result" style="margin-top:14px">
      ${renderPriceCheckResult(initQuery)}
    </div>

    <div class="row sp" style="margin-top:16px;border-top:1px dashed var(--bd);padding-top:12px">
      <small class="mu">Shortcut: Press <kbd>F7</kbd> anywhere in POS to open Price Check</small>
      <button class="b" onclick="closeM()">Close</button>

  `);

function doPriceCheckLookup(query, isEnter=false){
  const resBox=$('#pc_result');
  if(!resBox)return;
  resBox.innerHTML=renderPriceCheckResult(query, isEnter);
}

function renderPriceCheckResult(query, isEnter=false){
  const s=(query||'').trim().toLowerCase();
  if(!s){
    return `<div class="empty" style="padding:28px 8px;border:1px dashed var(--bd);border-radius:12px">
      
      <b>Ready to Scan or Search</b>
      <div class="mu" style="margin-top:4px">Point your barcode scanner at any item, or type name/SKU above.</div>
    </div>`;
  }

  // Exact barcode or SKU match first
  let exact = P.find(p => String(p.barcode||'').toLowerCase() === s || p.sku.toLowerCase() === s);
  if(exact){
    return renderPriceCheckCard(exact);
  }

  // Partial match
  const matches = P.filter(p => [p.name, p.sku, p.barcode, p.cat].some(x => String(x||'').toLowerCase().includes(s)));
  if(matches.length === 1){
    return renderPriceCheckCard(matches[0]);
  }

  if(matches.length > 1){
    return `
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--mu);margin-bottom:8px">Found ${matches.length} matching products:</div>
        <div style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto">
          ${matches.slice(0, 10).map(p => `
            <div class="card row sp" style="padding:10px 14px;cursor:pointer;transition:.15s" onclick="$('#pc_query').value='${esc(p.sku)}';doPriceCheckLookup('${esc(p.sku)}')">
              <div>
                <span class="tag in" style="font-size:10px">${esc(p.cat)}</span>
                <b style="display:block;margin-top:2px">${esc(p.name)}</b>
                <small class="mu">SKU: ${esc(p.sku)} ${p.barcode?`· Barcode: ${esc(p.barcode)}`:''}</small>
              </div>
              <div style="text-align:right">
                <b style="font-size:16px;color:var(--pr)">${money(p.price)}</b>
                <div style="font-size:11px;color:${p.stock>0?'#047857':'#be123c'}">${p.stock>0?p.stock+' in stock':'Out of stock'}</div>
                ${p.other_branches_stock>0?`<div style="font-size:10px;color:#2563eb;font-weight:600">+${p.other_branches_stock} in other stores</div>`:''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  return `<div class="empty" style="padding:28px 8px;border:1px dashed #ef4444;border-radius:12px;color:#be123c">
    
    <b>No Product Found for "${esc(query)}"</b>
    <div class="mu" style="margin-top:4px">Check the barcode or create a new product / custom item.</div>
  </div>`;
}

      title: currentLang==='bn' ? 'বর্তমান স্টোরের স্টক' : 'Current Store Stock',

      sub: p.stock <= (p.min || 0) && p.stock > 0 ? (currentLang==='bn'?'লো-স্টক সতর্কতা':'Low stock alert') : (p.stock > 0 ? (currentLang==='bn'?'বিক্রয়ের জন্য প্রস্তুত':'Ready for sale') : (currentLang==='bn'?'নতুন স্টক প্রয়োজন':'Reorder required')),

function generateBarcodeSVG(code, text){
  const C39 = {
    '0':'000110100','1':'100100001','2':'001100001','3':'101100000','4':'000110001',
    '5':'100110000','6':'001110000','7':'000100101','8':'100100100','9':'001100100',
    'A':'100001001','B':'001001001','C':'101001000','D':'000011001','E':'100011000',
    'F':'001011000','G':'000001101','H':'100001100','I':'001001100','J':'000011100',
    'K':'100000011','L':'001000011','M':'101000010','N':'000010011','O':'100010010',
    'P':'001010010','Q':'000000111','R':'100000110','S':'001000110','T':'000010110',
    'U':'110000001','V':'011000001','W':'111000000','X':'010010001','Y':'110010000',
    'Z':'011010000','-':'010000101','.':'110000100',' ':'011000100','$':'010101000',
    '/':'010100010','+':'010001010','%':'000101010','*':'010010100'
  };
  const raw = String(code||'').toUpperCase().replace(/[^0-9A-Z\-\. \$\/\+\%]/g, '') || '0000';
  const str = '*' + raw + '*';
  let bars = [];
  for(let i=0; i<str.length; i++){
    const pat = C39[str[i]] || C39['-'];
    for(let j=0; j<9; j++){
      bars.push({ black: (j % 2 === 0), wide: pat[j] === '1' });
    }
    bars.push({ black: false, wide: false });
  }
  let totalW = 0;
  bars.forEach(b => { totalW += (b.wide ? 3 : 1); });
  const scale = 2;
  const svgW = (totalW + 16) * scale;
  const svgH = 58;
  let x = 8 * scale;
  let rects = '';
  for(const b of bars){
    const w = (b.wide ? 3 : 1) * scale;
    if(b.black){
      rects += `<rect x="${x}" y="3" width="${w}" height="38" fill="#000"/>`;
    }
    x += w;
  }
  return `<svg viewBox="0 0 ${svgW} ${svgH}" width="100%" height="${svgH}" style="max-height:${svgH}px" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#fff"/>
    ${rects}
    <text x="${svgW/2}" y="52" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle" fill="#000">${esc(text || raw)}</text>
  </svg>`;
}

// ==================== BARCODE & LABEL STUDIO ====================
function generateUniqueBarcode(prefix = '890'){
  let bc = '';
  let attempts = 0;
  do {
    if(prefix === '71M'){
      const rand = Math.floor(100000 + Math.random() * 900000);
      bc = '71M-' + String(rand);
    } else {
      const rand = Math.floor(100000000 + Math.random() * 900000000);
      bc = (prefix || '890') + String(rand);
    }
    attempts++;
  } while (P.some(p => p.barcode === bc) && attempts < 50);
  return bc;
}

function generateUniqueSKU(prefix = 'SKU'){
  let sku = '';
  let attempts = 0;
  do {
    const rand = Math.floor(1000 + Math.random() * 9000);
    sku = (prefix || 'SKU') + '-' + String(rand);
    attempts++;
  } while (P.some(p => p.sku === sku) && attempts < 50);
  return sku;
}

function setCustomBarcode(code){
  cbState.code = code;
  const el = $('#cb_code');
  if(el) el.value = code;
  soundScan();
  updateBarcodePreview();
}

function copyCustomBarcode(){
  const code = (barcodeModalTab === 'custom' ? (cbState.code || $('#cb_code')?.value) : (P.find(x => x.id === bpSelectedProdId)?.barcode || '')) || '';
  if(!code) return toast('No barcode code found to copy');
  navigator.clipboard.writeText(code).then(() => toast('Barcode copied: ' + code));
}

function downloadBarcodeSVG(){
  let code = '';
  let name = '';
  if(barcodeModalTab === 'custom'){
    code = cbState.code || $('#cb_code')?.value || '890123456789';
    name = cbState.name || $('#cb_name')?.value || 'custom-item';
  } else {
    const p = P.find(x => x.id === bpSelectedProdId) || P[0];
    code = p ? (p.barcode || p.sku || '890123456789') : '890123456789';
    name = p ? p.name : 'product';
  }
  const svg = generateBarcodeSVG(code, code);
  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `barcode-${code}.svg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Barcode SVG file downloaded');
}

async function saveCustomBarcodeAsProduct(){
  const name = (cbState.name || $('#cb_name')?.value || '').trim();
  const code = (cbState.code || $('#cb_code')?.value || '').trim();
  const price = +(cbState.price || $('#cb_price')?.value || 0);
  const sku = (cbState.sku || $('#cb_sku')?.value || '').trim() || generateUniqueSKU('SKU');

  if(!name){
    alert('Please enter an item or product name');
    $('#cb_name')?.focus();
    return;
  }
  if(!code){
    alert('Please enter or generate a barcode');
    $('#cb_code')?.focus();
    return;
  }

  const dup = P.find(x => x.barcode && String(x.barcode).toLowerCase() === code.toLowerCase());
  if(dup){
    alert(`Barcode "${code}" is already used by product: ${dup.name}`);
    return;
  }

  run(async () => {
    await api('product_save', {
      name,
      sku,
      barcode: code,
      cat: 'General',
      cost: Math.round(price * 0.8),
      price,
      vat: 0,
      min_stock: 5,
      stock: 10
    });
    toast(`Product "${name}" saved to store with barcode: ${code}!`);
    await loadP();
    closeM();
    if(view === 'prod') rProd();
  });
}

function adjForm(id){const p=P.find(x=>x.id===id);modal(`<b style="font-size:17px">Adjust stock</b><p class="mu">${esc(p.name)} · current store stock: ${p.stock}</p><div class="f"><label>Type<select id="ad_t"><option value="in">Stock in (received)</option><option value="out">Stock out (damaged / expired)</option></select></label><label>Quantity<input id="ad_q" type="number" min="0" step="any" onkeydown="if(event.key==='Enter'){event.preventDefault();doAdj(${id});}"></label><label class="w">Note<input id="ad_n" onkeydown="if(event.key==='Enter'){event.preventDefault();doAdj(${id});}"></label></div><div class="row" style="margin-top:16px"><button class="b p" onclick="doAdj(${id})">Apply</button><button class="b" onclick="closeM()">Cancel</button></div>`)}
function doAdj(id){run(async()=>{await api('stock_adjust',{id,type:$('#ad_t').value,qty:$('#ad_q').value,note:$('#ad_n').value});closeM();await loadP();rProd()})}

      accent: '#64748b',
      bg: 'linear-gradient(135deg, #64748b, #475569)',
      shadow: '0 4px 14px rgba(100, 116, 139, 0.32)',
      icon: '<path d="M21 8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>'
    },
    {
      title: currentLang==='bn' ? 'মোট লাভ (Total Profit)' : 'Total Net Profit',
      val: money(totProfit),
      sub: (currentLang==='bn' ? 'গড় মার্জিন: ' : 'Avg Margin: ') + avgMargin + '%',

    },
    {
      title: currentLang==='bn' ? 'বিক্রিত পণ্য (Sold Units)' : 'Total Sold Units',

      sub: currentLang==='bn' ? 'স্টক থেকে ডেলিভারি সম্পন্ন' : 'Dispatched from inventory',
      accent: '#0284c7',
      bg: 'linear-gradient(135deg, #0ea5e9, #0284c7)',
      shadow: '0 4px 14px rgba(2, 132, 199, 0.32)',
      icon: '<rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>'
    }
  ];

  $('#main').innerHTML=head('Sales History & Profit Analytics','Customer invoices, cost breakdown and profit analytics across stores')+

function viewRcpt(id){run(async()=>receipt(await api('sale_get',null,'&id='+id)))}

let couponsList=[];

async function rCoupons(){
  couponsList = await api('coupons');
  drawCouponsView();
}

function drawCouponsView(){
  const activeCount = couponsList.filter(c => c.is_active && (!c.expires_at || new Date(c.expires_at) >= new Date().setHours(0,0,0,0))).length;
  const totalUses = couponsList.reduce((a,c) => a + (parseInt(c.used_count)||0), 0);
  const fixedCount = couponsList.filter(c => c.type === 'fixed').length;
  const percentCount = couponsList.filter(c => c.type === 'percent').length;

  const actions = mgr() ? `
    <div class="row" style="gap:6px">
      <button class="b" onclick="quickRandomVoucherModal()">${currentLang==='bn'?'ভাউচার জেনারেট':'Generate Voucher'}</button>
      <button class="b p" onclick="couponModal()">+ ${currentLang==='bn'?'নতুন কুপন তৈরি':'Create New Coupon'}</button>

      <span class="tag in" style="font-size:11.5px;padding:6px 11px;font-weight:700;display:inline-flex;align-items:center;gap:5px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        ${currentLang==='bn'?'শুধু দেখার অনুমতি (ক্যাশিয়ার)':'View Only (Cashier)'}
      </span>
    </div>
  `;

  const couponKPIs = [
    {
      title: currentLang==='bn' ? 'সচল কুপন (Active Coupons)' : 'Active Coupons',
      val: `${activeCount} ${currentLang==='bn'?'টি সচল':'active'}`,
      sub: currentLang==='bn' ? 'পিওএস চেকআউটের জন্য প্রস্তুত' : 'Ready for POS checkout',
      accent: '#10b981',
      bg: 'linear-gradient(135deg, #10b981, #059669)',
      shadow: '0 4px 14px rgba(16, 185, 129, 0.32)',
      icon: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'
    },
    {
      title: currentLang==='bn' ? 'মোট ব্যবহার (Redemptions)' : 'Total Redemptions',
      val: `${totalUses} ${currentLang==='bn'?'বার':'times'}`,
      sub: currentLang==='bn' ? 'গ্রাহকদের সফলভাবে প্রদানকৃত' : 'Used by shoppers at checkout',
      accent: '#4f46e5',
      bg: 'linear-gradient(135deg, #6366f1, #4338ca)',
      shadow: '0 4px 14px rgba(79, 70, 229, 0.32)',
      icon: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'
    },
    {
      title: currentLang==='bn' ? 'নির্দিষ্ট টাকা ছাড় (Fixed ৳)' : 'Fixed Taka (৳) Coupons',
      val: `${fixedCount} ${currentLang==='bn'?'টি কুপন':'coupons'}`,
      sub: currentLang==='bn' ? 'নির্দিষ্ট টাকার ফ্ল্যাট ছাড়' : 'Flat cash savings on cart',
      accent: '#d97706',
      bg: 'linear-gradient(135deg, #f59e0b, #d97706)',
      shadow: '0 4px 14px rgba(217, 119, 6, 0.32)',
      icon: '<circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><line x1="12" y1="6" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="18"/>'

          </div>

          <div class="row sp" style="font-size:12px;margin-top:4px">
            <span class="mu">Min Order Required:</span>
            <b>${c.min_order>0?money(c.min_order):'No minimum'}</b>
          </div>
          <div class="row sp" style="font-size:12px;margin-top:4px">

            ${currentLang==='bn'?'কোড কপি করুন':'Copy Code'}
          </button>
          ${mgr() ? `
            <div class="row" style="gap:4px">
              <button class="b" style="padding:4px 8px;font-size:11px" onclick="toggleCouponActive(${c.id},${c.is_active?1:0})">${c.is_active?'Disable':'Enable'}</button>
              <button class="b" style="padding:4px 8px;font-size:11px" onclick="couponModal(${c.id})">Edit</button>
              <button class="b d" style="padding:4px 8px;font-size:11px" onclick="deleteCoupon(${c.id},'${esc(c.code)}')">Delete</button>
            </div>
          ` : `
            <span class="tag ok" style="font-size:11px">${currentLang==='bn'?'কাউন্টারে প্রযোজ্য':'Ready for POS'}</span>
          `}
        </div>
      </div>`;
    }).join('') : '<div class="empty" style="grid-column:1/-1">No promo coupons created yet. Click "+ Create New Coupon" or "Generate Voucher" to add one.</div>'}
  </div>`;
}

function copyCouponCode(code){
  navigator.clipboard.writeText(code).then(()=>{
    toast('Copied coupon code "'+code+'" to clipboard!');
  }).catch(()=>{
    toast('Coupon code: '+code);
  });
}

function couponModal(id=0){
  if(!mgr()) return toast(currentLang==='bn'?'শুধুমাত্র অ্যাডমিন কুপন তৈরি বা এডিট করতে পারবেন':'Access Denied: Only Admin can create or edit coupons');
  const cp = couponsList.find(x => x.id === id) || {
    code: '',
    label: '',
    type: 'fixed',
    val: 50,
    min_order: 200,
    usage_limit: 0,
    expires_at: '',
    is_active: 1
  };

  modal(`
    <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:14px">
      <div>
        <b style="font-size:17px">${id ? 'Edit Coupon Voucher' : 'Create New Promo Coupon'}</b>
        <div class="mu" style="font-size:12px">Cashier can apply this coupon in POS during checkout</div>
      </div>
      <button class="b" onclick="closeM()" style="padding:4px 9px" title="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <div class="f">
      <label class="w">
        <div class="row sp">
          <span>Coupon Code * (e.g. SAVE50, EID2026)</span>
          <button type="button" class="chip" style="font-size:10px;padding:2px 6px" onclick="generateRandomCouponCode()">Auto Code</button>
        </div>
        <input id="cp_code" value="${esc(cp.code)}" placeholder="e.g. SUPER10" style="text-transform:uppercase;font-weight:700;font-family:ui-monospace,Menlo,monospace" autofocus>
      </label>

      <label class="w">Promotion Label / Description *
        <input id="cp_label" value="${esc(cp.label)}" placeholder="e.g. Flat ৳50 Discount on ৳200+ Grocery">
      </label>

      <label>Discount Type *
        <select id="cp_type" onchange="updateCouponUnitLabel()">
          <option value="fixed" ${cp.type==='fixed'?'selected':''}>Fixed Amount (৳ Taka)</option>
          <option value="percent" ${cp.type==='percent'?'selected':''}>Percentage (% Off)</option>
        </select>
      </label>

      <label>Discount Value (<span id="cp_unit_lbl">${cp.type==='percent'?'%':'৳'}</span>) *
        <input id="cp_val" type="number" step="any" min="0.01" value="${cp.val}">
      </label>

      <label>Minimum Order Amount (৳)
        <input id="cp_min" type="number" step="any" min="0" value="${cp.min_order||0}">
        <small class="mu">Cart subtotal must reach this amount</small>
      </label>

      <label>Usage Limit (Redemptions)
        <input id="cp_limit" type="number" min="0" value="${cp.usage_limit||0}">
        <small class="mu">0 = Unlimited redemptions</small>
      </label>

      <label>Expiration Date
        <input id="cp_expires" type="date" value="${cp.expires_at?cp.expires_at.slice(0,10):''}">
        <small class="mu">Leave blank for no expiration</small>
      </label>

      <label style="justify-content:center">Status
        <div class="row" style="margin-top:6px">
          <input id="cp_active" type="checkbox" style="width:auto;transform:scale(1.2)" ${cp.is_active?'checked':''}>
          <span style="font-size:13px;font-weight:600">Active (Available in POS)</span>
        </div>
      </label>
    </div>

    <div class="row" style="margin-top:16px">
      <button class="b p" style="flex:1;padding:10px" onclick="saveCoupon(${id})">${id?'Save Changes':'Create Coupon'}</button>
      <button class="b" onclick="closeM()">Cancel</button>
    </div>
  `);
}

function updateCouponUnitLabel(){
  const type = $('#cp_type')?.value;
  const lbl = $('#cp_unit_lbl');
  if(lbl) lbl.textContent = type === 'percent' ? '%' : '৳';
}

function generateRandomCouponCode(){
  const prefixes = ['SAVE', 'MART', 'SUPER', 'OFF', 'VOUCH', 'MEGA'];
  const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
  const num = Math.floor(10 + Math.random() * 90);
  const code = prefix + num;
  const input = $('#cp_code');
  if(input) { input.value = code; input.focus(); }
}

function saveCoupon(id=0){
  if(!mgr()) return toast(currentLang==='bn'?'শুধুমাত্র অ্যাডমিন কুপন তৈরি বা পরিবর্তন করতে পারবেন':'Access Denied: Only Admin can create or edit coupons');
  run(async()=>{
  const code = $('#cp_code')?.value.trim().toUpperCase();
  const label = $('#cp_label')?.value.trim();
  const type = $('#cp_type')?.value;
  const val = parseFloat($('#cp_val')?.value);
  const min_order = parseFloat($('#cp_min')?.value) || 0;
  const usage_limit = parseInt($('#cp_limit')?.value) || 0;
  const expires_at = $('#cp_expires')?.value || null;
  const is_active = $('#cp_active')?.checked ? 1 : 0;

  if(!code) throw new Error('Please enter a coupon code');
  if(!label) throw new Error('Please enter a label for the coupon');
  if(isNaN(val) || val <= 0) throw new Error('Please enter a valid discount value');
  if(type === 'percent' && val > 100) throw new Error('Percentage discount cannot exceed 100%');

  const res = await api('coupon_save', {
    id,
    code,
    label,
    type,
    val,
    min_order,
    usage_limit,
    expires_at,
    is_active
  });

  closeM();
  toast(id ? 'Coupon updated successfully!' : 'New coupon "'+code+'" created!');
  await rCoupons();
})}

function toggleCouponActive(id, currentActive){
  if(!mgr()) return toast(currentLang==='bn'?'শুধুমাত্র অ্যাডমিন কুপন স্ট্যাটাস পরিবর্তন করতে পারবেন':'Access Denied: Only Admin can modify coupons');
  run(async()=>{
  const cp = couponsList.find(x => x.id === id);
  if(!cp) return;
  await api('coupon_save', {
    ...cp,
    is_active: currentActive ? 0 : 1
  });
  toast('Coupon '+cp.code+' '+(currentActive?'disabled':'enabled'));
  await rCoupons();
})}

function deleteCoupon(id, code){
  if(!mgr()) return toast(currentLang==='bn'?'শুধুমাত্র অ্যাডমিন কুপন ডিলিট করতে পারবেন':'Access Denied: Only Admin can delete coupons');
  modal(`<b style="font-size:17px">Delete Coupon</b>
  <p style="margin:12px 0">Are you sure you want to delete coupon <b>${esc(code)}</b>?</p>
  <div class="row" style="gap:8px">
    <button class="b d" style="background:#ef4444;color:#fff;border:0;padding:8px 16px;font-weight:700" onclick="doDeleteCoupon(${id})">Yes, Delete Coupon</button>
    <button class="b" onclick="closeM()">Cancel</button>
  </div>`);
}

function doDeleteCoupon(id){
  if(!mgr()) return toast('Access Denied');
  run(async()=>{
  await api('coupon_delete', { id });
  closeM();
  toast('Coupon deleted successfully');

function doQuickVoucher(type, val, min_order, label){
  if(!mgr()) return toast('Access Denied');
  run(async()=>{
  const prefixes = ['SUPER', 'DEAL', 'SAVE', 'VOUCH', 'MART'];
  const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
  const num = Math.floor(100 + Math.random() * 900);
  const code = prefix + num;

  await api('coupon_save', {
    code,
    label: label + ' (' + code + ')',

    val,
    min_order,

}

function renderStockInRows(){
  const tbody = $('#stock_in_rows');
  if(!tbody) return;

  let totalQty = 0;
  let grandTotal = 0;

  tbody.innerHTML = stockInItems.map((item, idx)=>{
    const subtotal = (item.qty || 0) * (item.cost || 0);
    totalQty += (item.qty || 0);
    grandTotal += subtotal;

    return `
      <tr>
        <td>
          <select style="width:100%" onchange="stockInItems[${idx}].prod_id=+this.value; const p=P.find(x=>x.id===+this.value); if(p){stockInItems[${idx}].cost=p.cost||0}; renderStockInRows()">
            ${P.map(p=>`<option value="${p.id}" ${p.id===item.prod_id?'selected':''}>${esc(p.name)} (Curr: ${money(p.cost)})</option>`).join('')}
          </select>
        </td>
        <td>
          <input type="number" min="1" step="any" value="${item.qty}" style="width:90px" oninput="stockInItems[${idx}].qty=parseFloat(this.value)||0; calcStockInTotal()">
        </td>
        <td>
          <input type="number" min="0" step="any" value="${item.cost}" style="width:110px" oninput="stockInItems[${idx}].cost=parseFloat(this.value)||0; calcStockInTotal()">
        </td>
        <td><b>${money(subtotal)}</b></td>
        <td>
          ${stockInItems.length > 1 ? `<button class="chip" style="color:#ef4444;display:inline-flex;align-items:center;padding:3px 7px" onclick="stockInItems.splice(${idx},1); renderStockInRows()" title="Remove row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>` : ''}
        </td>
      </tr>
    `;
  }).join('');

  calcStockInTotal();
}

function calcStockInTotal(){
  let totalQty = 0;
  let grandTotal = 0;
  stockInItems.forEach(item=>{
    const q = item.qty || 0;
    const c = item.cost || 0;
    totalQty += q;
    grandTotal += (q * c);
  });
  if($('#si_total_qty')) $('#si_total_qty').textContent = totalQty;
  if($('#si_grand_total')) $('#si_grand_total').textContent = money(grandTotal);
  if($('#si_paid') && (!$('#si_paid').value || parseFloat($('#si_paid').value) === 0)){
    $('#si_paid').value = grandTotal.toFixed(2);
  }
}

function addStockInRow(){
  const first = P[0] || {id:1, cost:100};
  stockInItems.push({
    prod_id: first.id,
    qty: 10,
    cost: first.cost || 100
  });
  renderStockInRows();
}

function saveStockInOrder(){run(async()=>{
  const supplier_id = +$('#si_supplier').value;
  const supplier_invoice_no = $('#si_inv').value.trim();
  const paid_amount = parseFloat($('#si_paid').value) || 0;
  const note = $('#si_note').value.trim();

  if(!supplier_id) throw new Error('Please select a supplier');
  if(!stockInItems.length) throw new Error('Please add at least one item');

  for(const it of stockInItems){
    if(!it.prod_id || it.qty <= 0) throw new Error('Each item must have a valid product and quantity > 0');
  }

  await api('purchase_save', {
    supplier_id,
    supplier_invoice_no,
    items: stockInItems,
    paid_amount,
    note
  });

  closeM();
  toast('Stock received successfully! Inventory updated.');
  await loadP(); // Refresh products stock count everywhere
  await rPurchases();
})}

let reportTab='profit', reportFrom='', reportTo='';

function exportTableToCSV(tableId, filename){
  const table=document.getElementById(tableId);
  if(!table)return toast('No data table to export');
  let csv=[];
  const rows=table.querySelectorAll('tr');
  for(const row of rows){
    const cols=row.querySelectorAll('th, td');
    const rowData=[];
    for(const col of cols){
      let text=col.innerText.replace(/"/g,'""').trim();
      rowData.push('"'+text+'"');
    }
    csv.push(rowData.join(','));
  }
  const blob=new Blob([csv.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(filename||'export')+'.csv';
  a.click();
  toast('Exported '+filename+'.csv');
}

function getAuditActionMeta(act){
  if(AUDIT_ACTION_MAP[act]) return AUDIT_ACTION_MAP[act];
  const parts = (act || '').split('.');
  const cat = parts[0] ? parts[0].charAt(0).toUpperCase() + parts[0].slice(1) : 'System';
  return { label: act, bn: act, cat, color: '#64748b', bg: 'rgba(100,116,139,0.1)' };
}

function parseAuditValues(val){
  if(!val) return {};
  if(typeof val === 'object') return val;
  try { return JSON.parse(val) || {}; } catch(e){ return { raw: String(val) }; }
}

function getAuditSummaryHtml(item){
  const vals = parseAuditValues(item.new_values);
  const act = item.action || '';

  if(act === 'sale.create'){
    const invText = vals.invoice_no ? esc(vals.invoice_no) : `#${item.auditable_id}`;
    const inv = `<button type="button" class="tag in" onclick="reprintAuditInvoice(${item.auditable_id})" title="${currentLang==='bn'?'ইনভয়েস রিপ্রিন্ট করুন':'Click to reprint invoice'}" style="cursor:pointer;border:1px solid var(--bd);padding:1px 6px;font-family:monospace;font-weight:700">${invText}</button>`;
    const tot = vals.grand_total !== undefined ? vals.grand_total : (vals.grand !== undefined ? vals.grand : 0);
    const items = vals.items_count ? `${vals.items_count} ${vals.items_count===1?'item':'items'}` : '';
    return `<span style="color:#047857;font-weight:700">${money(tot)}</span> &bull; ${inv} ${items?`&bull; <span class="mu">${items}</span>`:''}`;
  }
  if(act === 'sale.reprint'){
    const invText = vals.invoice_no ? esc(vals.invoice_no) : `#${item.auditable_id}`;
    const inv = `<button type="button" class="tag in" onclick="reprintAuditInvoice(${item.auditable_id})" title="${currentLang==='bn'?'পুনরায় প্রিন্ট করুন':'Click to reprint'}" style="cursor:pointer;border:1px solid var(--bd);padding:1px 6px;font-family:monospace;font-weight:700">${invText}</button>`;
    const tot = vals.grand_total !== undefined ? vals.grand_total : 0;
    return `<span style="color:#0284c7;font-weight:700">Reprint: ${money(tot)}</span> &bull; ${inv} ${vals.reprinted_by?`&bull; <span class="mu">By ${esc(vals.reprinted_by)}</span>`:''}`;
  }
  if(act === 'sale.refund'){
    const refTot = vals.refund_total !== undefined ? vals.refund_total : 0;
    const invBtn = item.auditable_id ? `<button type="button" class="tag" onclick="reprintAuditInvoice(${item.auditable_id})" title="${currentLang==='bn'?'মূল রসিদ রিপ্রিন্ট করুন':'Reprint original receipt'}" style="cursor:pointer;border:1px solid var(--bd);padding:1px 5px;font-size:10px">Sale #${item.auditable_id}</button>` : '';
    return `<span style="color:#be123c;font-weight:700">Refund: −${money(refTot)}</span> ${invBtn} ${vals.reason?`&bull; <span class="mu">${esc(vals.reason)}</span>`:''}`;
  }
  if(act === 'stock.adjust'){
    const qty = vals.qty_adjusted !== undefined ? vals.qty_adjusted : (vals.qty !== undefined ? vals.qty : 0);
    const isOut = qty < 0;
    const pName = vals.product_name ? esc(vals.product_name) : `Product #${item.auditable_id}`;
    return `<span class="tag ${isOut?'out':'ok'}" style="font-weight:700">${isOut?'Out':'In'}: ${qty>0?'+':''}${qty}</span> &bull; <b>${pName}</b>`;
  }
  if(act === 'stock.return'){
    const qty = vals.qty || 0;
    const amt = vals.amount || 0;
    return `<span style="color:#ea580c;font-weight:700">Return ${qty} units</span> &bull; ${money(amt)} &bull; <span class="mu">${esc(vals.reason||'Damaged')}</span>`;
  }
  if(act === 'shift.open'){
    return `Opening Cash: <b style="color:#2563eb">${money(vals.opening_cash||0)}</b>`;
  }
  if(act === 'shift.close'){
    const diff = vals.diff || 0;
    const diffBadge = diff === 0 ? `<span class="tag ok">Balanced</span>` : (diff > 0 ? `<span class="tag in">+${money(diff)} Over</span>` : `<span class="tag out">${money(diff)} Short</span>`);
    return `Counted: <b>${money(vals.counted||0)}</b> &bull; ${diffBadge}`;
  }
  if(act === 'shift.cash_in' || act === 'shift.cash_out'){
    const isOut = act.includes('cash_out');
    return `<span class="tag ${isOut?'out':'ok'}">${isOut?'Cash Out':'Cash In'}: ${money(vals.amount||0)}</span> ${vals.note?`&bull; <span class="mu">${esc(vals.note)}</span>`:''}`;
  }
  if(act === 'customer.create' || act === 'customer.update'){
    return `<b>${esc(vals.name||'Member')}</b> ${vals.phone?`&bull; <span class="mu">${esc(vals.phone)}</span>`:''}`;
  }
  if(act === 'customer.points_adjust'){
    const chg = vals.change || 0;
    return `Points: <b style="color:#d97706">${chg>0?'+':''}${chg} pts</b> &bull; New: <b>${vals.new_total||0} pts</b>`;
  }
  if(act === 'customer.due_payment'){
    return `Collected: <b style="color:#10b981">${money(vals.amount||0)}</b> (${esc(vals.method||'Cash')}) &bull; Remaining Due: <b>${money(vals.new_due||0)}</b>`;
  }
  if(act === 'customer.points_to_coupon'){
    return `Code: <b style="font-family:monospace;color:#7c3aed">${esc(vals.coupon_code||'')}</b> &bull; <span style="color:#059669;font-weight:700">${money(vals.discount_tk||0)}</span> (${vals.points_converted||0} pts)`;
  }
  if(act === 'product.create' || act === 'product.update'){
    return `<b>${esc(vals.name||vals.product_name||'Product')}</b> ${vals.price?`&bull; Price: ${money(vals.price)}`:''}`;
  }
  if(act === 'product.delete'){
    return `<span style="color:#ef4444;font-weight:700">Deleted:</span> ${esc(vals.product_name||vals.name||('#'+item.auditable_id))}`;
  }
  if(act === 'coupon.save'){
    return `Code: <b style="font-family:monospace">${esc(vals.code||'')}</b> &bull; Discount: <b>${vals.val||0}</b>`;
  }
  if(act === 'coupon.delete'){
    return `<span style="color:#e11d48">Deleted Coupon:</span> <b>${esc(vals.code||'')}</b>`;
  }
  if(act === 'expense.create'){
    return `Expense: <b style="color:#e11d48">${money(vals.amount||0)}</b> &bull; ${esc(vals.method||'Cash')}`;
  }
  if(act === 'purchase.create'){
    return `PO Total: <b style="color:#0891b2">${money(vals.grand_total||0)}</b>`;
  }
  if(act === 'user.create' || act === 'user.update'){
    return `<b>${esc(vals.name||'User')}</b> &bull; <span class="mu">${esc(vals.email||'')}</span>`;
  }
  if(act === 'branch.create' || act === 'branch.update' || act === 'branch.delete'){
    return `Branch: <b>${esc(vals.name||'Outlet')}</b> ${vals.code?`(${esc(vals.code)})`:''}`;
  }

  const keys = Object.keys(vals);
  if(keys.length === 0) return `<span class="mu">No additional payload</span>`;
  return keys.slice(0, 3).map(k => `${k}: <b>${esc(String(vals[k]))}</b>`).join(' &bull; ');
}

function formatAuditFieldRow(key, val, allVals){
  const label = AUDIT_FIELD_LABELS[key] || key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
  let formatted = '';

  if(key === 'invoice_no'){
    formatted = `<div style="display:inline-flex;align-items:center;gap:6px">
      <b style="font-family:monospace;letter-spacing:0.5px;font-size:13px;color:var(--p)">${esc(String(val))}</b>
      <button type="button" class="b" onclick="reprintAuditInvoice('${esc(String(val))}')" style="padding:2px 8px;font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;gap:3px;background:rgba(5,150,105,0.1);color:#059669;border-color:rgba(5,150,105,0.3)">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        ${currentLang==='bn'?'রিপ্রিন্ট':'Reprint'}
      </button>
    </div>`;
  } else if(key === 'grand_total' || key === 'grand' || key === 'subtotal' || key === 'discount_amount' || key === 'cart_discount' || key === 'tax_total' || key === 'paid_total' || key === 'change_due' || key === 'opening_cash' || key === 'counted' || key === 'expected' || key === 'refund_total' || key === 'amount' || key === 'discount_tk' || key === 'price' || key === 'cost'){
    formatted = `<b style="color:#047857;font-size:13.5px">${money(Number(val)||0)}</b>`;
  } else if(key === 'diff'){
    const n = Number(val) || 0;
    formatted = n === 0 ? `<span class="tag ok" style="font-weight:700">Balanced (৳0.00)</span>` : (n > 0 ? `<span class="tag in" style="font-weight:700">+${money(n)} (Cash Over)</span>` : `<span class="tag out" style="font-weight:700">${money(n)} (Cash Shortage)</span>`);
  } else if(key === 'is_active'){
    formatted = val ? `<span class="tag ok">Active / সচল</span>` : `<span class="tag out">Disabled / বন্ধ</span>`;
  } else if(key === 'payment_methods' && typeof val === 'object' && val !== null){
    formatted = `<div style="display:flex;gap:4px;flex-wrap:wrap">` + Object.keys(val).map(pm => `<span class="tag in" style="font-size:11px"><b>${pm.toUpperCase()}:</b> ${money(val[pm])}</span>`).join('') + `</div>`;
  } else if(key === 'coupon_code'){
    formatted = `<b style="font-family:monospace;letter-spacing:1px;font-size:14px;color:#7c3aed;background:rgba(124,58,237,0.08);padding:2px 8px;border-radius:4px">${esc(String(val))}</b>`;
  } else if(key === 'previous_stock' && allVals.new_stock !== undefined){
    const diff = (allVals.new_stock || 0) - (val || 0);
    formatted = `<span>${val} units &rarr; <b>${allVals.new_stock} units</b> (${diff >= 0 ? '+' : ''}${diff})</span>`;
  } else if(key === 'prev_due' && allVals.new_due !== undefined){
    formatted = `<span>${money(val)} &rarr; <b style="color:#be123c">${money(allVals.new_due)}</b></span>`;
  } else if(typeof val === 'object' && val !== null){
    formatted = `<div style="font-size:11.5px;background:var(--bg);padding:6px 10px;border-radius:6px;border:1px solid var(--bd);text-align:left">` +
      Object.keys(val).map(subK => `<div style="margin-bottom:2px"><span class="mu" style="font-weight:600">${esc(subK)}:</span> <b>${esc(String(val[subK]))}</b></div>`).join('') +
      `</div>`;
  } else {
    formatted = `<span>${esc(String(val))}</span>`;
  }

  return `
  <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--bd);gap:12px">
    <span style="font-weight:600;font-size:12px;color:var(--mu);min-width:160px">${esc(label)}</span>
    <div style="font-size:12.5px;color:var(--tx);text-align:right;flex:1;word-break:break-word">${formatted}</div>
  </div>`;
}

async function reprintAuditInvoice(saleId){
  if(!saleId) return toast(currentLang==='bn'?'ইনভয়েস সনাক্তকারী পাওয়া যায়নি':'Sale ID or invoice number is missing');
  try {
    const r = await api('sale_reprint', null, '&id=' + encodeURIComponent(saleId));
    if(!r || !r.inv) return toast(currentLang==='bn'?'ইনভয়েস খুঁজে পাওয়া যায়নি':'Invoice not found');
    receipt(r);
  } catch(e) {
    try {
      const r = await api('sale_get', null, '&id=' + encodeURIComponent(saleId));
      if(!r || !r.inv) return toast(currentLang==='bn'?'ইনভয়েস খুঁজে পাওয়া যায়নি':'Invoice not found');
      receipt(r);
    } catch(err) {
      toast(err.message || (currentLang==='bn'?'ইনভয়েস লোড করা ব্যর্থ হয়েছে':'Failed to load invoice'));
    }
  }
}
