async function submitPromptReprint(){
  const val = ($('#reprint_inv_input')?.value || '').trim();
  if(!val) return toast(currentLang==='bn'?'অনুগ্রহ করে ইনভয়েস নম্বর লিখুন':'Please enter an invoice number');
  closeM();
  reprintAuditInvoice(val);
}

function setAuditPeriod(p){
  auditPeriod = p;
  rAuditLog();
}

function onAuditCustomDateChange(){
  const fromEl = $('#audit_from_input');
  const toEl = $('#audit_to_input');
  if(!fromEl || !toEl) return;
  let fromVal = fromEl.value;
  let toVal = toEl.value;
  if(fromVal && toVal){
    const dFrom = new Date(fromVal);
    const dTo = new Date(toVal);
    const diffDays = (dTo - dFrom) / (86400000);
    if(diffDays > 730){
      toast(currentLang==='bn'?'কাস্টম সময়সীমা সর্বোচ্চ ২ বছর হতে পারে।':'Custom date range cannot exceed 2 years. Adjusted to 2 years.');
      const adjustedFrom = new Date(dTo.getTime() - 730 * 86400000);
      fromEl.value = adjustedFrom.toISOString().slice(0, 10);
    }
  }
}

function applyAuditCustomDates(){
  const fromEl = $('#audit_from_input');
  const toEl = $('#audit_to_input');
  if(!fromEl || !toEl) return;
  onAuditCustomDateChange();
  auditCustomFrom = fromEl.value;
  auditCustomTo = toEl.value;
  auditPeriod = 'custom';
  rAuditLog();
}

    if(auditBranchFilter) params += '&branch_id=' + encodeURIComponent(auditBranchFilter);
    if(auditPeriod) params += '&period=' + encodeURIComponent(auditPeriod);
    if(auditPeriod === 'custom' && auditCustomFrom && auditCustomTo){
      params += '&from=' + encodeURIComponent(auditCustomFrom) + '&to=' + encodeURIComponent(auditCustomTo);

function syncCurrentSettingsFromDom(){

  if($('#tc_invoice_prefix')) currentSettings.invoice_prefix = $('#tc_invoice_prefix').value.trim().toUpperCase();

  if($('#tc_receipt_header')) currentSettings.receipt_header = $('#tc_receipt_header').value.trim();
  if($('#tc_currency')) currentSettings.currency = $('#tc_currency').value.trim();
  if($('#tc_currency_code')) currentSettings.currency_code = $('#tc_currency_code').value.trim().toUpperCase();
  if($('#tc_vat_default')) currentSettings.vat_default = parseFloat($('#tc_vat_default').value) || 0;
  if($('#tc_loyalty_rate')) currentSettings.loyalty_rate = parseFloat($('#tc_loyalty_rate').value) || 50;
  if($('#tc_loyalty_value')) currentSettings.loyalty_value = parseFloat($('#tc_loyalty_value').value) || 1;
  if($('#tc_low_stock')) currentSettings.low_stock_threshold = parseInt($('#tc_low_stock').value) || 5;
  if($('#tc_receipt_footer')) currentSettings.receipt_footer = $('#tc_receipt_footer').value.trim();
  if($('#tc_allow_negative_stock')) currentSettings.allow_negative_stock = parseInt($('#tc_allow_negative_stock').value) || 0;
  currentSettings.sound_enabled = soundEnabled ? 1 : 0;
}

function updateLoyaltyCalc(){
  const amt = parseFloat($('#calc_test_order')?.value) || 0;
  const rate = parseFloat($('#tc_loyalty_rate')?.value) || parseFloat(currentSettings?.loyalty_rate) || 50;
  const val = parseFloat($('#tc_loyalty_value')?.value) || parseFloat(currentSettings?.loyalty_value) || 1;
  const pts = Math.floor(amt / (rate > 0 ? rate : 50));
  const cash = pts * val;
  const pct = amt > 0 ? ((cash / amt) * 100).toFixed(1) : '0.0';
  if($('#calc_pts_res')) $('#calc_pts_res').textContent = pts + ' pts';
  if($('#calc_val_res')) $('#calc_val_res').textContent = (currentSettings?.currency||'৳') + ' ' + cash.toFixed(2);
  if($('#calc_pct_res')) $('#calc_pct_res').textContent = pct + '%';
}

function saveTerminalSettings(){run(async()=>{
  if(!mgr()) throw new Error('Only Admin can modify terminal configuration');
  syncCurrentSettingsFromDom();
  const payload = {
    store_name: currentSettings.store_name || '71 Mart',
    invoice_prefix: currentSettings.invoice_prefix || '71M',
    store_address: currentSettings.store_address || '',
    store_phone: currentSettings.store_phone || '',
    bin_number: currentSettings.bin_number || '',
    receipt_header: currentSettings.receipt_header || '',
    currency: currentSettings.currency || '৳',
    currency_code: currentSettings.currency_code || 'BDT',
    vat_default: parseFloat(currentSettings.vat_default) || 0,
    loyalty_rate: parseFloat(currentSettings.loyalty_rate) || 50,
    loyalty_value: parseFloat(currentSettings.loyalty_value) || 1,
    low_stock_threshold: parseInt(currentSettings.low_stock_threshold) || 5,
    receipt_footer: currentSettings.receipt_footer || '',
    allow_negative_stock: parseInt(currentSettings.allow_negative_stock) || 0,
    sound_enabled: soundEnabled ? 1 : 0
  };

  const res = await api('settings_save', payload);
  toast(res.message || (currentLang==='bn'?'সেটিংস সফলভাবে সংরক্ষিত হয়েছে!':'Configuration saved successfully!'));
  U.active_branch_name = payload.store_name;
  storeSettings = { ...storeSettings, ...payload };
  await loadSettings();
  if($('#s_store_title')) $('#s_store_title').textContent = payload.store_name;
  await loadBranches();
  renderStoreSwitcher();
  drawSettingsView();
})}

function doChangePassword(){run(async()=>{
  const current=$('#sp_current').value;
  const newPass=$('#sp_new').value;
  const confirmPass=$('#sp_confirm').value;
  if(!current)throw new Error('Please enter your current password');
  if(newPass.length<6)throw new Error('New password must be at least 6 characters');
  if(newPass!==confirmPass)throw new Error('New passwords do not match');
  await api('password_change',{current,new_password:newPass});
  $('#sp_current').value='';
  $('#sp_new').value='';
  $('#sp_confirm').value='';
  toast('Password updated successfully!');
})}

// Keyboard Shortcuts Listener for Cashier Efficiency
// Global Hardware Barcode Scanner & Keyboard Shortcuts Listener
let barcodeScannerBuffer = '';
let barcodeScanLastTime = 0;

window.addEventListener('keydown', e => {
  const isModalOpen = $('#modal') && $('#modal').style.display === 'flex';
  
  // 1. Modals handling (Escape to close, Enter to print/finish receipt)
  if (isModalOpen) {
    if (e.key === 'Escape') {
      closeM();
      return;
    }
    if (e.key === 'Enter') {
      if ($('#receipt')) {
        e.preventDefault();
        printReceipt();
        return;
      }
    }
    return;
  }

  // 2. Escape closes catalog drawer
  if (e.key === 'Escape') {
    if (typeof isCatalogDrawerOpen !== 'undefined' && isCatalogDrawerOpen) {
      e.preventDefault();
      closeCatalogDrawer();
      return;
    }
    if (view === 'pos' && $('#qs')) {
      $('#qs').value = '';
      q = '';
      drawGrid();
      $('#qs').focus();
      return;
    }
  }

  if (view !== 'pos') return;

  const target = e.target;
  const isInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT');

  // 3. Complete Sale / Checkout (F10 or Ctrl+Enter or Cmd+Enter)
  if (e.key === 'F10' || ((e.ctrlKey || e.metaKey) && e.key === 'Enter')) {
    e.preventDefault();
    checkout();
    return;
  }

  // 4. Function Key Shortcuts + Mac Alt Fallbacks
  // F1 or Alt+Q: Toggle Quick Catalog Drawer
  if (e.key === 'F1' || (e.altKey && (e.key === 'q' || e.key === 'Q'))) {
    e.preventDefault();
    toggleCatalogDrawer();
    return;
  }

  // F2 or Alt+S: Focus Barcode Scanner / Product Search
  if (e.key === 'F2' || (e.altKey && (e.key === 's' || e.key === 'S'))) {
    e.preventDefault();
    if (typeof isCatalogDrawerOpen !== 'undefined' && isCatalogDrawerOpen) closeCatalogDrawer();
    $('#qs')?.focus();
    $('#qs')?.select();
    return;
  }

  // F3 or Alt+C: Focus Customer Phone Lookup
  if (e.key === 'F3' || (e.altKey && (e.key === 'c' || e.key === 'C'))) {
    e.preventDefault();
    $('#loy_phone')?.focus();
    $('#loy_phone')?.select();
    return;
  }

  // F4 or Alt+X: Clear Cart
  if (e.key === 'F4' || (e.altKey && (e.key === 'x' || e.key === 'X'))) {
    e.preventDefault();
    clearCart();
    return;
  }

  // F7 or Alt+P: Price Check Modal
  if (e.key === 'F7' || (e.altKey && (e.key === 'p' || e.key === 'P'))) {
    e.preventDefault();
    priceCheckModal();
    return;
  }

  // F8 or Alt+H: Hold Order
  if (e.key === 'F8' || (e.altKey && (e.key === 'h' || e.key === 'H'))) {
    e.preventDefault();
    holdCart();
    return;
  }

  // F9 or Alt+M: Exact Cash Tendered & Focus
  if (e.key === 'F9' || (e.altKey && (e.key === 'm' || e.key === 'M'))) {
    e.preventDefault();
    setPayMethod('cash');
    pay.cash = calc().grand;
    if ($('#pay_cash')) $('#pay_cash').value = pay.cash;
    updatePaymentChange();
    $('#pay_cash')?.focus();
    $('#pay_cash')?.select();
    return;
  }

  // Alt + 1..5 for Payment Methods
  if (e.altKey) {
    if (e.key === '1') { e.preventDefault(); setPayMethod('cash'); $('#pay_cash')?.focus(); return; }
    if (e.key === '2') { e.preventDefault(); setPayMethod('bkash'); ($('#pay_mfs_trx') || $('#pay_bkash_trx'))?.focus(); return; }
    if (e.key === '3') { e.preventDefault(); setPayMethod('card'); $('#pay_card_last4')?.focus(); return; }
    if (e.key === '4') { e.preventDefault(); setPayMethod('due'); return; }
    if (e.key === '5') { e.preventDefault(); setPayMethod('split'); return; }
  }

  // 5. Hardware Barcode Scanner Buffer & Enter handling
  const now = Date.now();
  const diff = now - barcodeScanLastTime;
  barcodeScanLastTime = now;

  const isOtherInput = target && (target.id === 'loy_phone' || target.id === 'cart_order_note' || (target.tagName === 'INPUT' && target.id !== 'qs'));

  if (e.key === 'Enter') {
    // 1. If Modal is Open: Enter triggers the Apply or Primary action button
    const modalEl = $('#modal');
    if (modalEl && window.getComputedStyle(modalEl).display !== 'none') {
      if (target && target.tagName === 'TEXTAREA') {
        return; // Allow newline in multiline textarea
      }
      e.preventDefault();
      const mbox = $('#mbox');
      if (mbox) {
        const btns = Array.from(mbox.querySelectorAll('button'));
        // Find Apply / Confirm / Save button
        const applyBtn = btns.find(b => {
          const txt = (b.textContent || '').trim().toLowerCase();
          const oc = (b.getAttribute('onclick') || '').toLowerCase();
          return txt.includes('apply') || txt.includes('প্রয়োগ') || txt.includes('প্রয়োগ') || oc.includes('apply') || oc.includes('confirm') || oc.includes('save') || oc.includes('doadj') || oc.includes('doshift');
        });
        if (applyBtn) {
          applyBtn.click();
          return;
        }
        // Fallback: First primary button (.b.p or .p)
        const primaryBtn = mbox.querySelector('button.b.p, button.p');
        if (primaryBtn) {
          primaryBtn.click();
          return;
        }
      }
      return;
    }

    // 2. Hardware scanner buffer handling
    if (barcodeScannerBuffer.length >= 3 && !isOtherInput) {
      e.preventDefault();
      const code = barcodeScannerBuffer.trim();
      barcodeScannerBuffer = '';
      const found = P.find(p => String(p.barcode || '').toLowerCase() === code.toLowerCase() || p.sku.toLowerCase() === code.toLowerCase());
      if (found) {
        addCart(found.id);
        toast(t('pos_auto_added') + found.name);
        if ($('#qs')) { $('#qs').value = ''; q = ''; drawGrid(); $('#qs').focus(); }
        return;
      }
    }
    barcodeScannerBuffer = '';

    // 3. Apply Actions on Inputs outside Modals:
    // A) Promo Coupon Input
    if (target && (target.id === 'coupon_input' || target.id === 'cart_coupon_code')) {
      e.preventDefault();
      applyCoupon(target.value);
      return;
    }

    // B) Cart Discount Input
    if (target && target.id === 'cart_disc_input') {
      e.preventDefault();
      cd.val = Math.max(0, parseFloat(target.value) || 0);
      drawCart();
      toast((currentLang==='bn'?'ডিসকাউন্ট প্রয়োগ করা হয়েছে: ':'Discount applied: ') + cd.val + (cd.type==='percent'?'%':'৳'));
      return;
    }

    // C) Dashboard Custom Dates
    if (target && (target.id === 'dash_from_input' || target.id === 'dash_to_input')) {
      e.preventDefault();
      applyDashCustomDates();
      return;
    }

    // D) Audit / Reports Custom Dates
    if (target && (target.id === 'audit_from_input' || target.id === 'audit_to_input')) {
      e.preventDefault();
      applyAuditCustomDates();
      return;
    }

    // E) Loyalty Customer Search Input
    if (target && target.id === 'loy_phone') {
      e.preventDefault();
      onLoyaltyPhoneEnter();
      return;
    }

    // F) Generic: Any input having an Apply button in its immediate container
    if (target && (target.tagName === 'INPUT' || target.tagName === 'SELECT')) {
      const parentRow = target.closest('.row, .f, .pos-disc-row, div');
      if (parentRow) {
        const rowBtns = Array.from(parentRow.querySelectorAll('button'));
        const rowApplyBtn = rowBtns.find(b => {
          const txt = (b.textContent || '').trim().toLowerCase();
          const oc = (b.getAttribute('onclick') || '').toLowerCase();
          return txt.includes('apply') || txt.includes('প্রয়োগ') || txt.includes('প্রয়োগ') || oc.includes('apply');
        });
        if (rowApplyBtn) {
          e.preventDefault();
          rowApplyBtn.click();
          return;
        }
      }
    }

    // 4. If typing in payment inputs or order note, Enter completes checkout
    if (target && (target.id === 'pay_cash' || target.id === 'pay_mfs_trx' || target.id === 'pay_mfs_phone' || target.id === 'pay_bkash_trx' || target.id === 'pay_card_last4' || target.id === 'cart_order_note')) {
      e.preventDefault();
      checkout();
      return;
    }

    // 5. If in #qs (barcode search) and it's empty, Enter completes checkout if cart has items
    if (target && target.id === 'qs') {
      if (!q.trim()) {
        e.preventDefault();
        if (cart.length > 0) checkout();
        return;
      }
    }

    // 6. If not focused on a text input and cart has items, Enter completes checkout
    if (!isInput && cart.length > 0) {
      e.preventDefault();
      checkout();
      return;
    }
  } else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
    if (diff > 80) {
      barcodeScannerBuffer = e.key;
    } else {
      barcodeScannerBuffer += e.key;
    }

    if (barcodeScannerBuffer.length >= 4 && !isOtherInput) {
      const code = barcodeScannerBuffer.trim();
      const found = P.find(p => String(p.barcode || '').toLowerCase() === code.toLowerCase() || p.sku.toLowerCase() === code.toLowerCase());
      if (found) {
        barcodeScannerBuffer = '';
        addCart(found.id);
        toast(t('pos_auto_added') + found.name);
        if ($('#qs')) { $('#qs').value = ''; q = ''; drawGrid(); $('#qs').focus(); }
      }
    }
  }
});

function updateSplitDiff(){
  const c = calc();
  const grand = c.grand;
  const cash = parseFloat($('#split_cash')?.value) || 0;
  const card = parseFloat($('#split_card')?.value) || 0;
  const bkash = parseFloat($('#split_bkash')?.value) || 0;
  const nagad = parseFloat($('#split_nagad')?.value) || 0;
  const due = parseFloat($('#split_due')?.value) || 0;

  const total = r2(cash + card + bkash + nagad + due);
  const diff = r2(grand - total);
  const banner = $('#split_status_banner');
  if(!banner) return;

  if(Math.abs(diff) < 0.01){
    banner.style.background = '#d1fae5';
    banner.style.border = '1px solid #10b981';
    banner.style.color = '#065f46';
    banner.innerHTML = `<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="display:inline-block;vertical-align:-1px;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg>Fully Balanced & Exact Total</span> <b>${money(total)}</b>`;
  } else if(diff > 0){
    banner.style.background = '#fffbeb';
    banner.style.border = '1px solid #f59e0b';
    banner.style.color = '#92400e';
    banner.innerHTML = `<span>Remaining to Cover:</span> <b>${money(diff)}</b>`;
  } else {
    banner.style.background = '#fee2e2';
    banner.style.border = '1px solid #ef4444';
    banner.style.color = '#991b1b';
    banner.innerHTML = `<span>Tendered Excess (Change):</span> <b>${money(Math.abs(diff))}</b>`;
  }
}

function fillSplitRemaining(targetId){
  const c = calc();
  const grand = c.grand;
  const fields = ['split_cash', 'split_card', 'split_bkash', 'split_nagad', 'split_due'];
  let othersSum = 0;
  fields.forEach(fid => {
    if(fid !== targetId){
      othersSum += parseFloat($('#' + fid)?.value) || 0;
    }
  });
  const rem = Math.max(0, r2(grand - othersSum));
  const el = $('#' + targetId);
  if(el){
    el.value = rem > 0 ? rem : '';
    updateSplitDiff();
  }
}

function applySplitPreset(mode){
  const grand = calc().grand;
  const fields = ['split_cash', 'split_card', 'split_bkash', 'split_nagad', 'split_due'];
  fields.forEach(id => { if($('#'+id)) $('#'+id).value = ''; });

  if(mode === 'half_card'){
    const h1 = r2(grand / 2);
    const h2 = r2(grand - h1);
    if($('#split_cash')) $('#split_cash').value = h1;
    if($('#split_card')) $('#split_card').value = h2;
  } else if(mode === 'half_bkash'){
    const h1 = r2(grand / 2);
    const h2 = r2(grand - h1);
    if($('#split_cash')) $('#split_cash').value = h1;
    if($('#split_bkash')) $('#split_bkash').value = h2;
  } else if(mode === 'equal_2'){
    const part = r2(grand / 2);
    if($('#split_cash')) $('#split_cash').value = part;
    if($('#split_card')) $('#split_card').value = r2(grand - part);
  } else if(mode === 'equal_3'){
    const p1 = r2(grand / 3);
    const p2 = r2(grand / 3);
    const p3 = r2(grand - p1 - p2);
    if($('#split_cash')) $('#split_cash').value = p1;
    if($('#split_card')) $('#split_card').value = p2;
    if($('#split_bkash')) $('#split_bkash').value = p3;
  }
  updateSplitDiff();
}

function confirmSplitPayment(){

}

async function processQuickRefund(saleId, totalAmount){
  const reason = $('#qr_reason')?.value || 'Customer Return';
  if(!confirm(`Are you sure you want to refund Invoice #${saleId} for ${money(totalAmount)} and restock items?`)) return;

  run(async () => {
    await api('refund', { id: saleId, reason: reason });
    await loadP();
    closeM();
    toast(`Invoice #${saleId} refunded successfully and items restocked!`);
    printReturnVoucher({ sale_id: saleId, refund_total: totalAmount, reason: reason, date: new Date().toLocaleString() });
    if(window.location.hash.includes('sales')) rSales();
    else if(view === 'dash') rDash();
  });
}

function onStockReturnProductChange(pid){
  const p = P.find(x => x.id === parseInt(pid));
  if(!p) return;
  if($('#sr_info_name')) $('#sr_info_name').textContent = p.name;
  if($('#sr_info_sku')) $('#sr_info_sku').textContent = `SKU: ${p.sku||'-'} · Category: ${p.cat||'-'}`;
  if($('#sr_info_stock')) $('#sr_info_stock').textContent = `Stock: ${p.stock||0} pcs`;
  if($('#sr_info_cost')) $('#sr_info_cost').textContent = `Cost: ${money(p.cost||0)}`;
  if($('#sr_cost')) $('#sr_cost').value = p.cost || 0;
  if($('#sr_qty')){
    $('#sr_qty').max = p.stock || 999;
    if(parseFloat($('#sr_qty').value) > p.stock) $('#sr_qty').value = Math.max(1, p.stock);
  }
  updateStockReturnTotal();
}

function onStockReturnTypeChange(type){
  const isSupp = type === 'supplier';
  if($('#sr_supplier_wrap')) $('#sr_supplier_wrap').style.display = isSupp ? 'flex' : 'none';
  if($('#sr_settlement_wrap')) $('#sr_settlement_wrap').style.display = isSupp ? 'flex' : 'none';
}

function updateStockReturnTotal(){
  const pid = parseInt($('#sr_product_id')?.value) || 0;
  const p = P.find(x => x.id === pid);
  const qty = parseFloat($('#sr_qty')?.value) || 0;
  const cost = parseFloat($('#sr_cost')?.value) || 0;
  const tot = qty * cost;
  if($('#sr_total_preview')) $('#sr_total_preview').textContent = money(tot);
  if($('#sr_stock_remaining_preview') && p){
    const rem = Math.max(0, (p.stock || 0) - qty);
    $('#sr_stock_remaining_preview').innerHTML = `Remaining Stock: <b>${rem} pcs</b>`;
  }
}

async function submitStockReturn(){
  const pid = parseInt($('#sr_product_id')?.value) || 0;
  const p = P.find(x => x.id === pid);
  if(!p) return toast('Please select a valid product');

  const qty = parseFloat($('#sr_qty')?.value) || 0;
  if(qty <= 0) return toast('Please enter a valid return quantity');
  if(qty > (p.stock || 0)) return toast(`Cannot return more than available stock (${p.stock} in stock)`);

  const cost = parseFloat($('#sr_cost')?.value) || (p.cost || 0);
  const type = $('#sr_type')?.value || 'supplier';
  const supplierId = parseInt($('#sr_supplier_id')?.value) || 0;
  const settlement = $('#sr_settlement')?.value || 'credit_note';
  const reason = $('#sr_reason')?.value || 'Stock Return';
  const note = $('#sr_note')?.value || '';

  if(!confirm(`Confirm returning ${qty} pcs of "${p.name}" (${money(qty * cost)})?`)) return;

  run(async () => {
    const res = await api('stock_return', {
      product_id: pid,
      qty: qty,
      type: type,
      supplier_id: supplierId,
      unit_cost: cost,
      settlement: settlement,
      reason: reason,
      note: note
    });

    await loadP();
    closeM();
    toast(`Stock Return #${res.reference_no||''} successful! Remaining stock: ${res.remaining_stock} pcs`);
    printStockReturnDebitNote({
      reference_no: res.reference_no,
      product_name: res.product_name,
      qty: res.qty,
      unit_cost: res.unit_cost,
      total: res.total,
      reason: reason,
      date: new Date().toLocaleString()
    });
    if(view === 'dash') rDash();
    else if(view === 'prod') rProd();
  });
}

    <div class="row"><span>Refund Tender:</span><span>Cash Out</span></div>
    <div class="line"></div>
    <div class="center" style="font-size:10px;margin-top:10px">
      * Items restocked into store inventory *<br>
      Thank you for shopping with us!
    </div>
  </body></html>`);
  win.document.close();
}

/* 3. QUICK DUE COLLECTION & KHATA SETTLEMENT */
async function quickDueCollectModal(prefillCustId = null){
  let customersWithDue = customersList.filter(c => (c.due_balance || 0) > 0);
  if(!customersWithDue.length){
    customersWithDue = customersList;
  }
  const selectedCid = prefillCustId || (customersWithDue[0]?.id || 0);
  const c = customersList.find(x => x.id === selectedCid) || customersWithDue[0];

  modal(`
    <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:34px;height:34px;border-radius:10px;background:rgba(5,150,105,0.12);display:grid;place-items:center;color:#059669">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><circle cx="7" cy="15" r="1"/></svg>
        </div>
        <div>
          <b style="font-size:16px">${currentLang==='bn'?'কাস্টমার বকেয়া কালেকশন (খাতা)':'Customer Due Collection & Khata'}</b>
          <div class="mu" style="font-size:12px">${currentLang==='bn'?'বকেয়া টাকা জমা নিন ও মানি রিসিট প্রিন্ট করুন':'Record customer credit collection & issue receipt'}</div>
        </div>
      </div>
      <button class="b" onclick="closeM()" style="padding:4px 9px" title="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <!-- Customer Picker -->
    <div style="margin-bottom:12px">
      <label class="w">Select Customer:
        <select id="qdc_cust" onchange="onQuickDueCustChange(this.value)" style="font-weight:600">
          ${customersList.map(cust => `
            <option value="${cust.id}" ${cust.id === selectedCid ? 'selected' : ''}>
              ${esc(cust.name)} (${esc(cust.phone)}) — Due: ${money(cust.due_balance||0)}
            </option>
          `).join('')}
        </select>
      </label>
    </div>

    <div id="qdc_body">
      ${renderQuickDueBody(c)}
    </div>
  `);
}

function onQuickDueCustChange(cid){
  const c = customersList.find(x => x.id === parseInt(cid));
  const el = $('#qdc_body');
  if(el && c) el.innerHTML = renderQuickDueBody(c);
}

function renderQuickDueBody(c){
  if(!c) return '<div class="empty">No customer selected.</div>';
  const due = parseFloat(c.due_balance) || 0;

  return `
    <div style="background:#fff1f2;border:1px solid #fecdd3;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <span style="font-size:12px;font-weight:700;color:#9f1239;text-transform:uppercase">Outstanding Due Balance</span>
        <div style="font-size:11px;color:#be123c;margin-top:2px">${esc(c.name)} · Credit Limit: ${money(c.credit_limit||0)}</div>
      </div>
      <b style="font-size:22px;color:#be123c">${money(due)}</b>
    </div>

    <div class="f">
      <label class="w">Collection Amount (৳)
        <input id="qdc_amt" type="number" step="any" min="1" max="${due>0?due:''}" value="${due>0?due:''}" placeholder="Enter amount...">
      </label>
      <div class="row" style="gap:6px;margin-bottom:6px;flex-wrap:wrap">
        ${due>0?`<button type="button" class="chip" onclick="$('#qdc_amt').value='${due}'">Full (${money(due)})</button>`:''}
        <button type="button" class="chip" onclick="$('#qdc_amt').value='500'">৳500</button>
        <button type="button" class="chip" onclick="$('#qdc_amt').value='1000'">৳1000</button>
        <button type="button" class="chip" onclick="$('#qdc_amt').value='2000'">৳2000</button>
        <button type="button" class="chip" onclick="$('#qdc_amt').value='5000'">৳5000</button>
      </div>

      <label class="w">Payment Tender
        <select id="qdc_method">
          <option value="cash">Cash (নগদ ক্যাশ)</option>
          <option value="bkash">bKash (বিকাশ)</option>
          <option value="nagad">Nagad (নগদ)</option>
          <option value="bank">Bank / Card</option>
        </select>
      </label>

      <label class="w">Collection Memo / Transaction Note
        <input id="qdc_note" placeholder="e.g. Counter due settlement / Trx ID">
      </label>
    </div>

    <div class="row sp" style="margin-top:16px;border-top:1px solid var(--bd);padding-top:12px">
      <button class="b" onclick="closeM()">${currentLang==='bn'?'বাতিল':'Cancel'}</button>
      <button class="b p" style="background:#059669" onclick="submitQuickDue(${c.id})">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline-block;vertical-align:-1px;margin-right:3px"><polyline points="20 6 9 17 4 12"/></svg>
        Record Payment & Print Voucher
      </button>
    </div>
  `;
}

async function submitQuickDue(cid){
  const amt = parseFloat($('#qdc_amt')?.value) || 0;
  const method = $('#qdc_method')?.value || 'cash';
  const note = $('#qdc_note')?.value.trim() || 'Due Collection';
  if(amt <= 0) return toast('Please enter a valid amount');

  run(async () => {
    const res = await api('customer_due_pay', { id: cid, amount: amt, method, note });
    if(res && res.receipt){
      const cust = customersList.find(x => x.id === cid);
      if(cust) cust.due_balance = res.receipt.current_due;
      if(selectedCustomer && selectedCustomer.id === cid) selectedCustomer.due_balance = res.receipt.current_due;
      closeM();
      toast('Due payment collected successfully!');
      printDueVoucher(res.receipt);
      if(window.location.hash.includes('cust')) rCust();
    }
  });
}

function printDueVoucher(r){
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>Money Receipt - ${esc(r.customer_name)}</title><style>
    @page { size: 80mm auto; margin: 0; }
    body { font-family: monospace; width: 72mm; margin: 0 auto; padding: 12px 6px; font-size: 12px; color: #000; }
    .center { text-align: center; }
    .line { border-top: 1px dashed #000; margin: 8px 0; }
    .row { display: flex; justify-content: space-between; }
    b { font-weight: bold; }
  </style></head><body onload="window.print();window.close();">
    <div class="center">
      <h3 style="margin:0 0 2px 0">CARTIVON POS</h3>
      <div style="font-size:11px">${esc(U?.active_branch_name || 'Store Outlet')}</div>
      <div style="font-size:11px">Codevix Technologies</div>
      <div class="line"></div>
      <b>OFFICIAL MONEY RECEIPT (বকেয়া আদায়)</b>
    </div>
    <div class="line"></div>
    <div class="row"><span>Customer:</span><b>${esc(r.customer_name)}</b></div>
    <div class="row"><span>Phone:</span><span>${esc(r.customer_phone)}</span></div>
    <div class="row"><span>Date:</span><span>${r.date}</span></div>
    <div class="row"><span>Cashier:</span><span>${esc(r.cashier)}</span></div>
    <div class="row"><span>Payment Method:</span><span>${esc(r.method).toUpperCase()}</span></div>
    <div class="line"></div>
    <div class="row"><span>Previous Due:</span><span>${money(r.previous_due)}</span></div>
    <div class="row" style="font-size:14px"><b>AMOUNT RECEIVED:</b><b>${money(r.amount_paid)}</b></div>
    <div class="row" style="color:#be123c"><b>REMAINING DUE:</b><b>${money(r.current_due)}</b></div>
    <div class="line"></div>
    <div class="center" style="font-size:10px;margin-top:10px">
      * Payment acknowledged and recorded into Khata ledger *<br>
      Thank you for your business!
    </div>
  </body></html>`);
  win.document.close();
}

</script>
</body>
</html>
